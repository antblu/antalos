server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /architecture/infrastructure/ { return 301 /infrastructure/platform/; }
    location = /architecture/infrastructure { return 301 /infrastructure/platform/; }
    location = /architecture/service-availability/ { return 301 /infrastructure/availability/; }
    location = /architecture/service-availability { return 301 /infrastructure/availability/; }
    location = /deployment-guide/prerequisites/ { return 301 /admin-guide/prerequisites/; }
    location = /deployment-guide/prerequisites { return 301 /admin-guide/prerequisites/; }
    location = /deployment-guide/deployment-order/ { return 301 /admin-guide/bootstrap/; }
    location = /deployment-guide/deployment-order { return 301 /admin-guide/bootstrap/; }
    location = /deployment-guide/cli-variables/ { return 301 /admin-guide/cli/; }
    location = /deployment-guide/cli-variables { return 301 /admin-guide/cli/; }
    location = /deployment-guide/k8s-secrets-bootstrap/ { return 301 /admin-guide/secrets/; }
    location = /deployment-guide/k8s-secrets-bootstrap { return 301 /admin-guide/secrets/; }
    location = /operations/routine-operations/ { return 301 /admin-guide/operations/; }
    location = /operations/routine-operations { return 301 /admin-guide/operations/; }
    location = /operations/litellm/ { return 301 /admin-guide/litellm/; }
    location = /operations/litellm { return 301 /admin-guide/litellm/; }
    location = /operations/rustdesk/ { return 301 /admin-guide/rustdesk/; }
    location = /operations/rustdesk { return 301 /admin-guide/rustdesk/; }
    location = /recovery/disaster-recovery/ { return 301 /admin-guide/disaster-recovery/; }
    location = /recovery/disaster-recovery { return 301 /admin-guide/disaster-recovery/; }
    location = /site/build-and-customize/ { return 301 /admin-guide/site-authoring/; }
    location = /site/build-and-customize { return 301 /admin-guide/site-authoring/; }
    location = /nextcloud/nc-storage/ { return 301 /infrastructure/nextcloud/; }
    location = /nextcloud/nc-storage { return 301 /infrastructure/nextcloud/; }
    location = /nextcloud/updating-nextcloud/ { return 301 /admin-guide/nextcloud-upgrades/; }
    location = /nextcloud/updating-nextcloud { return 301 /admin-guide/nextcloud-upgrades/; }
    location = /nextcloud/talk-backend/ { return 301 /admin-guide/nextcloud-talk/; }
    location = /nextcloud/talk-backend { return 301 /admin-guide/nextcloud-talk/; }
    location = /gitlab/deployment/ { return 301 /admin-guide/gitlab/; }
    location = /gitlab/deployment { return 301 /admin-guide/gitlab/; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|mjs|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
