allowBuilds:
  esbuild: true

# Exact versions already selected in the lockfile; retain the default age gate
# for all other releases, including future upgrades of these packages.
minimumReleaseAgeExclude:
  - '@astrojs/check@0.9.12'
  - '@astrojs/language-server@2.17.3'
  - '@astrojs/markdown-satteri@0.4.5'
  - '@astrojs/prism@4.1.1'
  - '@astrojs/telemetry@3.4.1'
  - 'astro@7.4.2'
