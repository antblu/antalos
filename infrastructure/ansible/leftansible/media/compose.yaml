  #     - ./ytdlp2strm/cookies.txt:/opt/ytdlp2STRM/plugins/youtube/cookies.txt
  #     - ./ytdlp2strm/ytdlp2strm.log:/opt/ytdlp2STRM/ytdlp2strm.log

  cliparr:
    image: ghcr.io/techsquidtv/cliparr:latest
    container_name: cliparr
    restart: unless-stopped
    environment:
      APP_KEY: ${CLIPARR_APP_KEY}
    ports:
      - "${LEFT_IP}:7171:7171"
    volumes:
      - cliparr-data:/data

volumes:
  seerr-config:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  qbittorrent-config:
  recyclarr-config:
  bazarr-config:
  subgen-models:
  autopulse-data:
  maintainerr-data:
  jellyfin-auto-collections-config:
  pixelfin-data:
  pixelfin-output:
  streamystats-data:
  lidarr-config:
  audiomuse-redis-data:
  audiomuse-postgres-data:
  audiomuse-flask-temp:
  audiomuse-flask-plugins:
  audiomuse-worker-temp:
  audiomuse-worker-plugins:
  multi-scrobbler-config:
  explo-config:
  ytdlp2strm-config:
  cliparr-data:
  gluetun-data: