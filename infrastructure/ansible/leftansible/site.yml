---
- name: Provision the Debian left host
  hosts: debian_left
  become: true
  gather_facts: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Require Debian on the left VM
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Debian"
          - ansible_facts["distribution_major_version"] | int >= 13
        fail_msg: This playbook requires Debian 13 or newer.

    - name: Set the VM hostname
      ansible.builtin.hostname:
        name: "{{ debian_left_hostname }}"

    - name: Read the VM timezone
      ansible.builtin.command:
        argv:
          - /usr/bin/timedatectl
          - show
          - --property=Timezone
          - --value
      register: configured_timezone
      changed_when: false

    - name: Set the VM timezone
      ansible.builtin.command:
        argv:
          - /usr/bin/timedatectl
          - set-timezone
          - "{{ debian_left_timezone }}"
      when: configured_timezone.stdout != debian_left_timezone
      changed_when: true

    - name: Configure Debian repositories with firmware components
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/debian.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://deb.debian.org/debian
          Suites: {{ ansible_facts["distribution_release"] }} {{ ansible_facts["distribution_release"] }}-updates
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: https://security.debian.org/debian-security
          Suites: {{ ansible_facts["distribution_release"] }}-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

    - name: Remove the legacy Debian source list
      ansible.builtin.file:
        path: /etc/apt/sources.list
        state: absent

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure the official Docker repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: {{ ansible_facts["distribution_release"] }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Update APT and install the latest system upgrades
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install Docker host packages
      ansible.builtin.apt:
        name: "{{ left_host_packages }}"
        state: present
        update_cache: true

    - name: Enable Docker and the QEMU guest agent
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - qemu-guest-agent

    - name: Create the Caddy Compose directory
      ansible.builtin.file:
        path: "{{ left_compose_root }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Deploy the Caddy Compose project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/caddy/"
        dest: "{{ left_compose_root }}/"
        owner: root
        group: root
        mode: preserve

    - name: Create the shared media mountpoint
      ansible.builtin.file:
        path: "{{ left_media_path }}"
        state: directory

    - name: Persist the shared media NFS mount
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^[^# ]+ /mnt/warm/jellyfin '
        line: "{{ left_media_export }} {{ left_media_path }} nfs4 rw,hard,_netdev,x-systemd.requires=network-online.target 0 0"
        state: present

    - name: Check whether shared media is mounted
      ansible.builtin.command:
        argv:
          - /usr/bin/findmnt
          - --noheadings
          - --output
          - SOURCE
          - --target
          - "{{ left_media_path }}"
      register: left_media_mount
      changed_when: false
      failed_when: false

    - name: Mount shared media
      ansible.builtin.command:
        argv:
          - /usr/bin/mount
          - "{{ left_media_path }}"
      when: left_media_mount.stdout != left_media_export
      changed_when: true

    - name: Require the intended shared media export
      ansible.builtin.command:
        argv:
          - /usr/bin/findmnt
          - --noheadings
          - --output
          - SOURCE
          - --target
          - "{{ left_media_path }}"
      register: left_media_mount_final
      changed_when: false
      failed_when: left_media_mount_final.stdout != left_media_export

    - name: Create the media Compose directory
      ansible.builtin.file:
        path: "{{ left_media_compose_root }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Deploy the media Compose project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/media/"
        dest: "{{ left_media_compose_root }}/"
        owner: root
        group: root
        mode: preserve

    - name: Allow Explo to read its protected configuration
      ansible.builtin.file:
        path: "{{ left_media_compose_root }}/explo/.env"
        state: file
        owner: root
        group: "1008"
        mode: "0640"

    - name: Allow autopulse to read its protected configuration
      ansible.builtin.file:
        path: "{{ left_media_compose_root }}/autopulse/config.yaml"
        state: file
        owner: root
        group: "1008"
        mode: "0640"
