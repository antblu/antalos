name: antalos-debian-arc

services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_MACHINE_LEARNING_VERSION}-openvino
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      MACHINE_LEARNING_DEVICE_IDS: "0"
    ports:
      - "${DEBIAN_ARC_IP}:${IMMICH_MACHINE_LEARNING_PORT}:3003/tcp"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID}"
    device_cgroup_rules:
      - c 226:* rmw
    volumes:
      - type: volume
        source: immich-model-cache
        target: /cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/ping', timeout=10)
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  nextcloud-talk-recording:
    image: ghcr.io/nextcloud-releases/aio-talk-recording:${NEXTCLOUD_TALK_RECORDING_VERSION}
    container_name: nextcloud-talk-recording
    restart: unless-stopped
    init: true
    user: "122"
    shm_size: 2gb
    environment:
      AIO_LOG_LEVEL: warn
      ALLOW_ALL: "false"
      HPB_DOMAIN: ${NEXTCLOUD_TALK_HOST}
      HPB_PATH: ""
      HPB_PROTOCOL: https
      INTERNAL_SECRET: ${NEXTCLOUD_TALK_INTERNAL_SECRET}
      NC_DOMAIN: ${NEXTCLOUD_HOST}
      NC_PROTOCOL: https
      RECORDING_SECRET: ${NEXTCLOUD_TALK_RECORDING_SECRET}
      SKIP_VERIFY: "false"
      TZ: ${TIMEZONE}
    ports:
      - "${DEBIAN_ARC_IP}:${NEXTCLOUD_TALK_RECORDING_PORT}:1234/tcp"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID}"
    volumes:
      - type: volume
        source: talk-recording-temporary-data
        target: /tmp
    healthcheck:
      test:
        - CMD
        - /healthcheck.sh
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /conf
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true

  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION}
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host
    user: "${JELLYFIN_UID}:${JELLYFIN_GID}"
    group_add:
      - "${RENDER_GID}"
      - "${MEDIA_GID}"
    environment:
      JELLYFIN_PublishedServerUrl: http://${DEBIAN_ARC_IP}:8096
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - type: bind
        source: ./data/jellyfin/config
        target: /config
      - type: bind
        source: ./data/jellyfin/cache
        target: /cache
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true

  trailarr:
    image: nandyalu/trailarr:latest
    container_name: trailarr
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
      PUID: ${MEDIA_UID}
      PGID: ${MEDIA_GID}
    ports:
      - "${DEBIAN_ARC_IP}:7889:7889/tcp"
    volumes:
      - type: bind
        source: ./data/trailarr
        target: /config
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
        bind:
          create_host_path: false
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    device_cgroup_rules:
      - c 226:* rmw

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
      PUID: ${MEDIA_UID}
      PGID: ${MEDIA_GID}
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      nodeName: arc-a310
      serverURL: http://127.0.0.1:8266
      ffmpegVersion: "7"
      transcodegpuWorkers: "1"
      transcodecpuWorkers: "0"
    ports:
      - "${DEBIAN_ARC_IP}:8265:8265/tcp"
      - "${DEBIAN_ARC_IP}:8266:8266/tcp"
    volumes:
      - type: bind
        source: ./data/tdarr/server
        target: /app/server
      - type: bind
        source: ./data/tdarr/configs
        target: /app/configs
      - type: bind
        source: ./data/tdarr/logs
        target: /app/logs
      - type: bind
        source: ./data/tdarr/temp
        target: /temp
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
        bind:
          create_host_path: false
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    device_cgroup_rules:
      - c 226:* rmw

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:${LAZYLIBRARIAN_VERSION}
    container_name: lazylibrarian
    restart: unless-stopped
    environment:
      PUID: ${MEDIA_UID}
      PGID: ${MEDIA_GID}
      TZ: ${TIMEZONE}
      UMASK: "002"
    ports:
      - "${DEBIAN_ARC_IP}:${LAZYLIBRARIAN_PORT}:5299/tcp"
    volumes:
      - type: bind
        source: ./data/lazylibrarian
        target: /config
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
        bind:
          create_host_path: false

  storyteller:
    image: registry.gitlab.com/storyteller-platform/storyteller:${STORYTELLER_VERSION}
    container_name: storyteller
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
      PUID: ${MEDIA_UID}
      PGID: ${MEDIA_GID}
      STORYTELLER_SECRET_KEY_FILE: /data/secret_key
      STORYTELLER_ASSETS_DIR: /media/storyteller
      STORYTELLER_CONFIG: /config/storyteller.json
      AUTH_URL: ${STORYTELLER_AUTH_URL}
    ports:
      - "${DEBIAN_ARC_IP}:${STORYTELLER_PORT}:8001/tcp"
    volumes:
      - type: bind
        source: ./data/storyteller
        target: /data
      - type: bind
        source: ./storyteller.json
        target: /config/storyteller.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
        bind:
          create_host_path: false
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"

  docling-server:
    image: antalos/docling-serve-xpu:${DOCLING_SERVE_VERSION}
    container_name: docling-server
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.docling-xpu
      args:
        DOCLING_SERVE_VERSION: ${DOCLING_SERVE_VERSION}
        INTEL_PYTORCH_XPU_IMAGE: ${INTEL_PYTORCH_XPU_IMAGE}
    environment:
      DOCLING_DEVICE: xpu
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENG_KIND: local
      UVICORN_WORKERS: "1"
    ports:
      - "${DEBIAN_ARC_IP}:${DOCLING_SERVE_PORT}:5001/tcp"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
    device_cgroup_rules:
      - c 226:* rmw
    ipc: host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=10)
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s
    security_opt:
      - no-new-privileges:true

volumes:
  immich-model-cache:
  talk-recording-temporary-data:
