name: antalos-debian-rtx

services:
  llama-cpp:
    image: ${LLAMA_CPP_IMAGE}
    container_name: llama-cpp
    restart: unless-stopped
    environment:
      LLAMA_ARG_API_KEY_FILE: /run/secrets/llama-api-key
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: "0"
    command:
      - --models-dir
      - /models
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "99"
      - --jinja
      - --metrics
    ports:
      - "${DEBIAN_RTX_IP}:${LLAMA_CPP_PORT}:8080/tcp"
    volumes:
      - type: bind
        source: /srv/llama-models
        target: /models
        read_only: true
      - type: bind
        source: ./secrets/llama-api-key
        target: /run/secrets/llama-api-key
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu
    security_opt:
      - no-new-privileges:true

  translate2:
    image: ${NEXTCLOUD_TRANSLATE2_IMAGE}
    container_name: translate2
    restart: unless-stopped
    environment:
      AA_VERSION: "3.2.0"
      APP_DISPLAY_NAME: Local Machine Translation
      APP_HOST: 0.0.0.0
      APP_ID: translate2
      APP_PERSISTENT_STORAGE: /data
      APP_PORT: ${NEXTCLOUD_TRANSLATE2_PORT}
      APP_PROTOCOL: http
      APP_SECRET: ${NEXTCLOUD_TRANSLATE2_APP_SECRET}
      APP_VERSION: ${NEXTCLOUD_TRANSLATE2_VERSION}
      COMPUTE_DEVICE: CUDA
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: "0"
    ports:
      - "${DEBIAN_RTX_IP}:${NEXTCLOUD_TRANSLATE2_PORT}:${NEXTCLOUD_TRANSLATE2_PORT}/tcp"
    volumes:
      - type: volume
        source: translate2-data
        target: /data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: antalos-debian-rtx

volumes:
  translate2-data:
