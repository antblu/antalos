global:
  affinity:
    podAntiAffinity: hard
server:
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.antblu.net
    tls: true
controller:
  replicas: 2
  heartbeatTime: 5
repoServer:
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
redis:
  enabled: false
redis-ha:
  enabled: true
  replicas: 3
  haproxy:
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
  tolerations:
    - key: quorum
      operator: Exists
      effect: NoSchedule
  sentinel:
    enabled: true
configs:
  params:
    server.insecure: true
    controller.sharding.algorithm: "round-robin"