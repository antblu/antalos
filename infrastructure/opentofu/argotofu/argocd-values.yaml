global:
  affinity:
    podAntiAffinity: hard

# The repo-server Deployment mounts this ConfigMap, so it must be part of the
# Helm release itself. Managing it only through argocd-self creates a bootstrap
# deadlock: Helm waits for repo-server while argocd-self cannot run yet.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: yaml-envsubst-plugin
      namespace: argocd
    data:
      plugin.yaml: |
        apiVersion: argoproj.io/v1alpha1
        kind: ConfigManagementPlugin
        metadata:
          name: yaml-envsubst
        spec:
          generate:
            command: [sh, -ec]
            args:
              - |
                for candidate in variables.yaml ../variables.yaml ../../apps/variables.yaml; do
                  if [ -f "$candidate" ]; then
                    variables_file="$candidate"
                    break
                  fi
                done

                substitution_expression='.'
                if [ -n "${variables_file:-}" ]; then
                  variable_entries=$(yq -r '.variables | to_entries[] | "\(.key)=\(.value)"' "$variables_file")
                else
                  variable_entries=$(env | sed -n 's/^ARGOCD_ENV_//p')
                fi

                while IFS='=' read -r name value; do
                  [ -n "$name" ] || continue
                  export "$name=$value"
                  substitution_expression="$substitution_expression | (.. | select(tag == \"!!str\")) |= sub(\"[$][{]$name[}]\"; strenv($name))"
                done <<EOF
                $variable_entries
                EOF

                # Only replace placeholders declared in variables.yaml. Broad
                # envsubst also erases Argo's reserved $values reference and
                # runtime variables such as $REDIS_PASSWORD.

                if [ "${ARGOCD_ENV_RENDER_MODE:-manifests}" = "applications" ]; then
                  find . -type f -name app.yaml -print | sort
                else
                  find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
                    ! -name app.yaml ! -name values.yaml ! -name variables.yaml -print | sort
                fi | while IFS= read -r manifest; do
                  printf '%s\n' '---'
                  yq "$substitution_expression" "$manifest"
                done
server:
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    tls: true
controller:
  replicas: 2
  heartbeatTime: 5
repoServer:
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  initContainers:
    - name: install-yq
      image: mikefarah/yq:4.45.4
      command: [sh, -ec]
      args:
        - cp "$(command -v yq)" /custom-tools/yq
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  extraContainers:
    - name: yaml-envsubst
      image: quay.io/argoproj/argocd:v3.5.1
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: PATH
          value: /custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: yaml-envsubst-plugin
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        - name: custom-tools
          mountPath: /custom-tools
        - name: cmp-tmp
          mountPath: /tmp
  volumes:
    - name: yaml-envsubst-plugin
      configMap:
        name: yaml-envsubst-plugin
    - name: custom-tools
      emptyDir: {}
    - name: cmp-tmp
      emptyDir: {}
redis:
  enabled: false
redis-ha:
  enabled: true
  replicas: 3
  haproxy:
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
  tolerations:
    - key: quorum
      operator: Exists
      effect: NoSchedule
  sentinel:
    enabled: true
configs:
  rbac:
    policy.csv: |
      g, Argo CD Admins, role:admin
      g, Argo CD Viewers, role:readonly
  params:
    server.insecure: true
    controller.sharding.algorithm: "round-robin"