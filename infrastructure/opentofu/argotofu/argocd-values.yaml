global:
  affinity:
    podAntiAffinity: hard

server:
  replicas: 2
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.antblu.net
    extraTls:
      - hosts:
          - argocd.antblu.net
        secretName: argocd-tls

controller:
  replicas: 2
  heartbeatTime: 5

repoServer:
  replicas: 2

redis:
  enabled: false

redis-ha:
  enabled: true
  # 3rd on tainted node rtx
  replicas: 3
  tolerations:
    - key: quorum
      operator: Exists
      effect: NoSchedule
  sentinel:
    enabled: true

configs:
  params:
    server.insecure: true
    controller.sharding.algorithm: "round-robin"