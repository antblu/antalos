apiVersion: v1
kind: ConfigMap
metadata:
  name: yaml-envsubst-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: yaml-envsubst
    spec:
      generate:
        command: [sh, -ec]
        args:
          - |
            for candidate in variables.yaml ../variables.yaml ../../apps/variables.yaml; do
              if [ -f "$candidate" ]; then
                variables_file="$candidate"
                break
              fi
            done
            : "${variables_file:?Unable to locate apps/variables.yaml}"

            while IFS='=' read -r name value; do
              export "$name=$value"
            done <<EOF
            $(yq -r '.variables | to_entries[] | "\(.key)=\(.value)"' "$variables_file")
            EOF

            if [ "${ARGOCD_ENV_RENDER_MODE:-manifests}" = "applications" ]; then
              find . -type f -name app.yaml -print | sort
            else
              find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
                ! -name app.yaml ! -name values.yaml ! -name variables.yaml -print | sort
            fi | while IFS= read -r manifest; do
              yq '(.. | select(tag == "!!str")) |= envsubst' "$manifest"
            done
