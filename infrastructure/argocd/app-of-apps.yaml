apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps
    plugin:
      name: yaml-envsubst
      env:
        - name: RENDER_MODE
          value: applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true