apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Antblue/antalos.git
    targetRevision: HEAD
    path: apps                    # ArgoCD watches this directory
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true                 # Delete apps removed from Git
      selfHeal: true              # Revert manual kubectl changes