apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbackup
  namespace: urbackup
  labels:
    app.kubernetes.io/name: urbackup
    app.kubernetes.io/part-of: antalos
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urbackup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urbackup
        app.kubernetes.io/part-of: antalos
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: urbackup
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      containers:
        - name: urbackup
          image: uroni/urbackup-server:${URBACKUP_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "${URBACKUP_PUID}"
            - name: PGID
              value: "${URBACKUP_PGID}"
            - name: TZ
              value: America/Denver
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETGID
                - SETUID
          ports:
            - name: web
              containerPort: 55414
              protocol: TCP
            - name: client-control
              containerPort: 55413
              protocol: TCP
            - name: client-data
              containerPort: 55415
              protocol: TCP
            - name: discovery
              containerPort: 35623
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /var/urbackup
            - name: backups
              mountPath: /backups
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: urbackup-config
        - name: backups
          persistentVolumeClaim:
            claimName: urbackup-backups
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: urbackup
  namespace: urbackup
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urbackup
---
apiVersion: v1
kind: Service
metadata:
  name: urbackup
  namespace: urbackup
  labels:
    app.kubernetes.io/name: urbackup
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: urbackup
  ports:
    - name: web
      port: 55414
      targetPort: web
      protocol: TCP
    - name: client-control
      port: 55413
      targetPort: client-control
      protocol: TCP
    - name: client-data
      port: 55415
      targetPort: client-data
      protocol: TCP
    - name: discovery
      port: 35623
      targetPort: discovery
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urbackup
  namespace: urbackup
  labels:
    app.kubernetes.io/name: urbackup
  annotations:
    gethomepage.dev/description: Backup administration
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: urbackup.png
    gethomepage.dev/name: UrBackup
    gethomepage.dev/weight: "80"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${URBACKUP_HOST}
      secretName: urbackup-tls
  rules:
    - host: ${URBACKUP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urbackup
                port:
                  name: web
