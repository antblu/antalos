apiVersion: v1
kind: Service
metadata:
  name: authentik-embedded-outpost
  namespace: urbackup
spec:
  type: ExternalName
  externalName: authentik-server.authentik.svc.cluster.local
  ports:
    - name: http
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: urbackup-authentik-outpost
  namespace: urbackup
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`${URBACKUP_HOST}`) && PathPrefix(`/outpost.goauthentik.io/`)
      services:
        - kind: Service
          name: authentik-embedded-outpost
          port: 80
  tls:
    secretName: urbackup-tls
