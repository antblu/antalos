apiVersion: v1
kind: Service
metadata:
  name: headplane
  namespace: headscale
  labels:
    app.kubernetes.io/name: headplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headplane
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headscale
  labels:
    app.kubernetes.io/name: headplane
    app.kubernetes.io/part-of: antalos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headplane
        app.kubernetes.io/part-of: antalos
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1002
        fsGroup: 1002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: restore
          image: docker.io/litestream/litestream:${LITESTREAM_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          args: [restore, -if-db-not-exists, -if-replica-exists, /var/lib/headplane/hp_persist.db]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/litestream.yml, subPath: litestream.yml, readOnly: true}
            - {name: data, mountPath: /var/lib/headplane}
            - {name: backup, mountPath: /backup}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane:${HEADPLANE_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME, value: /var/lib/headplane}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          startupProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/headplane/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: headscale-config, mountPath: /etc/headscale/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: secret, mountPath: /var/run/secrets/headplane, readOnly: true}
            - {name: data, mountPath: /var/lib/headplane}
            - {name: tmp, mountPath: /tmp}
        - name: litestream
          image: docker.io/litestream/litestream:${LITESTREAM_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          args: [replicate]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/litestream.yml, subPath: litestream.yml, readOnly: true}
            - {name: data, mountPath: /var/lib/headplane}
            - {name: backup, mountPath: /backup}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: headplane}
        - name: headscale-config
          configMap: {name: headscale}
        - name: secret
          secret: {secretName: headplane}
        - name: data
          emptyDir:
            sizeLimit: ${HEADPLANE_LOCAL_STORAGE_SIZE}
        - name: backup
          persistentVolumeClaim: {claimName: headscale-backup}
        - name: tmp
          emptyDir: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headplane-add-admin
  namespace: headscale
spec:
  addPrefix:
    prefix: /admin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headplane-cors
  namespace: headscale
spec:
  headers:
    accessControlAllowHeaders: ["*"]
    accessControlAllowMethods: [GET, POST, PUT]
    accessControlAllowOriginList:
      - https://${HEADSCALE_HOST}
    accessControlMaxAge: 100
    addVaryHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headplane
  namespace: headscale
  labels:
    app.kubernetes.io/name: headplane
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${HEADSCALE_HOST}
      secretName: headscale-tls
  rules:
    - host: ${HEADSCALE_HOST}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: headplane
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headplane-root
  namespace: headscale
  labels:
    app.kubernetes.io/name: headplane
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: headscale-headplane-add-admin@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${HEADSCALE_HOST}
      secretName: headscale-tls
  rules:
    - host: ${HEADSCALE_HOST}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: headplane
                port: {name: http}
