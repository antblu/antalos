apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane
  namespace: headscale
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 3000
      base_url: https://${HEADSCALE_HOST}
      cookie_secret_path: /var/run/secrets/headplane/cookie-secret
      cookie_secure: true
      cookie_max_age: 86400
      data_path: /var/lib/headplane
    headscale:
      url: http://headscale.headscale.svc.cluster.local
      public_url: https://${HEADSCALE_HOST}
      config_path: /etc/headscale/config.yaml
    integration:
      agent:
        enabled: false
      docker:
        enabled: false
      kubernetes:
        enabled: false
      proc:
        enabled: false
  litestream.yml: |
    dbs:
      - path: /var/lib/headplane/hp_persist.db
        replica:
          path: /backup/headplane-db
