apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emiliany
  namespace: emiliany
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${EMILIANY_HOST}
      secretName: emiliany-tls
  rules:
    - host: ${EMILIANY_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emiliany
                port:
                  name: http
