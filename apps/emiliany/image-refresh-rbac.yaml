apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-image-refresh
  namespace: emiliany
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - emiliany
    verbs:
      - get
      - patch
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - emiliany-registry
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-image-refresh
  namespace: emiliany
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: website-image-refresh
subjects:
  - kind: ServiceAccount
    name: website-image-refresh
    namespace: website-image-refresh
