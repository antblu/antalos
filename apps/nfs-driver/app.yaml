apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-driver
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes-csi.github.io/csi-driver-nfs
    chart: csi-driver-nfs
    targetRevision: ${NFS_DRIVER_CHART_VERSION}

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
