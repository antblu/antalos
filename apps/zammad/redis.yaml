apiVersion: v1
kind: ConfigMap
metadata:
  name: zammad-redis-config
  namespace: zammad
data:
  discover-master.sh: |
    #!/bin/sh
    votes=""
    for peer in zammad-redis-data-0.zammad-redis-data.zammad.svc.cluster.local zammad-redis-data-1.zammad-redis-data.zammad.svc.cluster.local zammad-redis-sentinel-2.zammad.svc.cluster.local; do
      reply=$(REDISCLI_AUTH="$REDIS_PASSWORD" timeout 3 redis-cli --raw -h "$peer" -p 26379 SENTINEL get-master-addr-by-name zammad 2>/dev/null) || continue
      set -- $reply
      if [ "$#" -eq 2 ] && [ "$2" = 6379 ]; then
        votes="$votes
    $1 $2"
      fi
    done
    # A single stale voter must not resurrect a former primary after failover.
    master=$(printf '%s\n' "$votes" | sort | uniq -c | awk '$1 >= 2 { print $2, $3; exit }')
    [ -n "$master" ] || exit 1
    printf '%s\n' "$master"
  start-redis.sh: |
    #!/bin/sh
    set -eu
    umask 077
    config=/data/redis.conf
    master=$(/config/discover-master.sh) || master=""
    if [ ! -s "$config" ]; then
      # Do not guess a writer while migrating an existing dataset without voters.
      if [ -z "$master" ] && { [ -d /data/appendonlydir ] || [ -f /data/dump.rdb ] || [ -f /data/appendonly.aof ]; }; then
        echo 'Existing Redis data requires agreement from two Sentinels before first config migration' >&2
        exit 1
      fi
      cat > "$config" <<REDIS
    dir /data
    appendonly yes
    appendfsync everysec
    requirepass "$REDIS_PASSWORD"
    masterauth "$REDIS_PASSWORD"
    protected-mode no
    replica-announce-ip $HOSTNAME.zammad-redis-data.zammad.svc.cluster.local
    REDIS
      if [ "$HOSTNAME" = zammad-redis-data-1 ]; then
        printf 'replicaof %s 6379\n' 'zammad-redis-data-0.zammad-redis-data.zammad.svc.cluster.local' >> "$config"
      fi
    fi
    # Existing members fail closed without agreement from two voters. Sentinels
    # start independently, including during a full-cluster recovery.
    if [ -z "$master" ] && { [ -d /data/appendonlydir ] || [ -f /data/dump.rdb ] || [ -f /data/appendonly.aof ]; }; then
      echo 'Existing Redis data requires agreement from two Sentinels before restart' >&2
      exit 1
    fi
    # Sentinel can now persist promotion/demotion with CONFIG REWRITE.
    if [ -n "$master" ]; then
      set -- $master
      sed -i '/^replicaof /d; /^slaveof /d' "$config"
      if [ "$1" != "$HOSTNAME.zammad-redis-data.zammad.svc.cluster.local" ] && [ "$1" != "$(hostname -i)" ]; then
        printf 'replicaof %s %s\n' "$1" "$2" >> "$config"
      fi
    fi
    exec redis-server "$config"
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    umask 077
    case "$HOSTNAME" in
      zammad-redis-data-0|zammad-redis-data-1)
        announce="$HOSTNAME.zammad-redis-data.zammad.svc.cluster.local"
        config=/sentinel/sentinel.conf
        ;;
      *)
        announce=zammad-redis-sentinel-2.zammad.svc.cluster.local
        config=/tmp/sentinel.conf
        ;;
    esac
    if [ ! -s "$config" ]; then
      master=$(/config/discover-master.sh) || master="zammad-redis-data-0.zammad-redis-data.zammad.svc.cluster.local 6379"
      set -- $master
      myid=$(printf '%s' "$announce" | sha1sum | cut -d ' ' -f 1)
      cat > "$config" <<SENTINEL
    port 26379
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    sentinel sentinel-pass "$REDIS_PASSWORD"
    sentinel myid $myid
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $announce
    sentinel monitor zammad $1 $2 2
    sentinel auth-pass zammad "$REDIS_PASSWORD"
    sentinel down-after-milliseconds zammad 5000
    sentinel failover-timeout zammad 60000
    sentinel parallel-syncs zammad 1
    SENTINEL
    fi
    exec redis-sentinel "$config"
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-redis-data
  namespace: zammad
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: zammad-redis-data
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zammad-redis-data
  namespace: zammad
spec:
  serviceName: zammad-redis-data
  replicas: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad-redis-data
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zammad-redis-data
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-redis.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zammad-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zammad-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            tcpSocket:
              port: sentinel
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /sentinel
      volumes:
        - name: config
          configMap:
            name: zammad-redis-config
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${ZAMMAD_REDIS_STORAGE_SIZE}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zammad-redis-data
  namespace: zammad
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-redis-sentinel-2
  namespace: zammad
spec:
  selector:
    app.kubernetes.io/name: zammad-redis-quorum
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-redis-quorum
  namespace: zammad
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad-redis-quorum
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - key: quorum
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zammad-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            tcpSocket:
              port: sentinel
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: ${ZAMMAD_REDIS_QUORUM_CPU_REQUEST}
              memory: ${ZAMMAD_REDIS_QUORUM_MEMORY_REQUEST}
            limits:
              cpu: ${ZAMMAD_REDIS_QUORUM_CPU_LIMIT}
              memory: ${ZAMMAD_REDIS_QUORUM_MEMORY_LIMIT}
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: zammad-redis-config
            defaultMode: 0555
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zammad-redis-quorum
  namespace: zammad
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-quorum
