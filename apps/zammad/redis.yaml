apiVersion: v1
kind: ConfigMap
metadata:
  name: zammad-redis-config
  namespace: zammad
data:
  start-redis.sh: |
    #!/bin/sh
    set -eu
    set -- redis-server \
      --appendonly yes \
      --appendfsync everysec \
      --requirepass "$REDIS_PASSWORD" \
      --masterauth "$REDIS_PASSWORD" \
      --protected-mode no
    if [ "$HOSTNAME" = zammad-redis-data-1 ]; then
      set -- "$@" --replicaof ${ZAMMAD_REDIS_DATA_0_HOST} 6379
    fi
    exec "$@"
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    cat > /tmp/sentinel.conf <<SENTINEL
    port 26379
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor zammad ${ZAMMAD_REDIS_DATA_0_HOST} 6379 2
    sentinel auth-pass zammad "$REDIS_PASSWORD"
    sentinel down-after-milliseconds zammad 5000
    sentinel failover-timeout zammad 60000
    sentinel parallel-syncs zammad 1
    SENTINEL
    exec redis-sentinel /tmp/sentinel.conf
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-redis-data
  namespace: zammad
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: zammad-redis-data
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zammad-redis-data
  namespace: zammad
spec:
  serviceName: zammad-redis-data
  replicas: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad-redis-data
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zammad-redis-data
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-redis.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zammad-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zammad-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            tcpSocket:
              port: sentinel
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: zammad-redis-config
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${ZAMMAD_REDIS_STORAGE_SIZE}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zammad-redis-data
  namespace: zammad
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-redis-sentinel-2
  namespace: zammad
spec:
  selector:
    app.kubernetes.io/name: zammad-redis-quorum
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-redis-quorum
  namespace: zammad
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad-redis-quorum
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - key: quorum
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zammad-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            tcpSocket:
              port: sentinel
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: ${ZAMMAD_REDIS_QUORUM_CPU_REQUEST}
              memory: ${ZAMMAD_REDIS_QUORUM_MEMORY_REQUEST}
            limits:
              cpu: ${ZAMMAD_REDIS_QUORUM_CPU_LIMIT}
              memory: ${ZAMMAD_REDIS_QUORUM_MEMORY_LIMIT}
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: zammad-redis-config
            defaultMode: 0555
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zammad-redis-quorum
  namespace: zammad
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-redis-quorum
