  OPENEBS_CHART_VERSION: 4.5.1
  RANCHER_CHART_VERSION: 2.15.0
  SEALED_SECRETS_CHART_VERSION: 2.19.3
  TRAEFIK_CHART_VERSION: 41.3.0
  VICTORIAMETRICS_CHART_VERSION: 0.91.2

