apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: ${METRICS_SERVER_CHART_VERSION}
      helm:
        releaseName: metrics-server
        valuesObject:
          args:
            - --kubelet-insecure-tls
    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/metrics-server
      plugin:
        name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: metrics-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
