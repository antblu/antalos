apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: stalwart
data:
  config.json: |
    {
      "@type": "PostgreSql",
      "host": "stalwart-db-rw.stalwart.svc.cluster.local",
      "port": 5432,
      "database": "stalwart",
      "authUsername": "stalwart",
      "authSecret": {
        "@type": "EnvironmentVariable",
        "variableName": "STALWART_DB_PASSWORD"
      }
    }
  bootstrap.ndjson: |
    {"@type":"update","object":"Bootstrap","value":{"serverHostname":"mail.antblu.net","defaultDomain":"antblu.net","requestTlsCertificate":false,"generateDkimKeys":true,"dataStore":{"@type":"PostgreSql","host":"stalwart-db-rw.stalwart.svc.cluster.local","port":5432,"database":"stalwart","authUsername":"stalwart","authSecret":{"@type":"EnvironmentVariable","variableName":"STALWART_DB_PASSWORD"}},"blobStore":{"@type":"S3","region":{"@type":"Custom","customEndpoint":"http://10.30.0.5:30188","customRegion":"garage"},"bucket":"mail","accessKey":{"@type":"EnvironmentVariable","variableName":"STALWART_S3_ACCESS_KEY"},"secretKey":{"@type":"EnvironmentVariable","variableName":"STALWART_S3_SECRET_KEY"},"securityToken":{"@type":"None"},"sessionToken":{"@type":"None"},"verifyAfterWrite":true},"searchStore":{"@type":"ElasticSearch","url":"http://elasticsearch.stalwart.svc.cluster.local:9200","numShards":1,"numReplicas":1,"includeSource":false,"httpAuth":{"@type":"Unauthenticated"}},"inMemoryStore":{"@type":"RedisSentinel","urls":["redis://redis-0.redis.stalwart.svc.cluster.local:26379","redis://redis-1.redis.stalwart.svc.cluster.local:26379","redis://redis-sentinel-2.stalwart.svc.cluster.local:26379"],"serviceName":"stalwart","authUsername":"default","authSecret":{"@type":"EnvironmentVariable","variableName":"STALWART_REDIS_PASSWORD"},"sentinelUsername":"default","sentinelSecret":{"@type":"EnvironmentVariable","variableName":"STALWART_REDIS_PASSWORD"},"protocolVersion":"resp3"},"directory":{"@type":"Internal"},"dnsServer":{"@type":"Manual"}}}
    {"@type":"upsert","object":"Certificate","matchOn":["certificate"],"value":{"mail":{"certificate":{"@type":"File","filePath":"/etc/stalwart/tls/tls.crt"},"privateKey":{"@type":"File","filePath":"/etc/stalwart/tls/tls.key"}}}}
    {"@type":"update","object":"SystemSettings","value":{"defaultCertificateId":"#mail"}}
    {"@type":"update","object":"Coordinator","value":{"@type":"Default"}}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    metallb.io/loadBalancerIP: 10.30.0.200
    metallb.io/allow-shared-ip: antblu-net
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: smtps
      port: 465
      targetPort: smtps
    - name: submission
      port: 587
      targetPort: submission
    - name: imap
      port: 143
      targetPort: imap
    - name: imaps
      port: 993
      targetPort: imaps
    - name: pop3
      port: 110
      targetPort: pop3
    - name: pop3s
      port: 995
      targetPort: pop3s
    - name: sieve
      port: 4190
      targetPort: sieve
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-web
  namespace: stalwart
spec:
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: management
      port: 8080
      targetPort: management
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mail.antblu.net
      secretName: mail-tls
  rules:
    - host: mail.antblu.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart-web
                port:
                  name: management
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-headless
  namespace: stalwart
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: management
      port: 8080
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
spec:
  serviceName: stalwart-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-b63-g32
                      - talos-vu1-efl
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: stalwart
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.19
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-db-app
                  key: password
            - name: STALWART_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-storage
                  key: s3-access-key
            - name: STALWART_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-storage
                  key: s3-secret-key
            - name: STALWART_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-redis
                  key: password
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-bootstrap-admin
                  key: credential
            - name: STALWART_PUBLIC_URL
              value: https://mail.antblu.net
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
            - name: pop3
              containerPort: 110
            - name: pop3s
              containerPort: 995
            - name: sieve
              containerPort: 4190
            - name: https
              containerPort: 443
            - name: management
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: management
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: mail-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stalwart
  namespace: stalwart
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-bootstrap
  namespace: stalwart
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: stalwart-cli
          image: ghcr.io/stalwartlabs/cli:1.0.12
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          args:
            - apply
            - --file
            - /config/bootstrap.ndjson
            - --quiet
          env:
            - name: STALWART_URL
              value: http://stalwart-web.stalwart.svc.cluster.local:8080
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-bootstrap-admin
                  key: username
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-bootstrap-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-config
