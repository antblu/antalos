apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: stalwart
data:
  config.json: |
    {
      "@type": "PostgreSql",
      "host": "stalwart-db-rw.stalwart.svc.cluster.local",
      "port": 5432,
      "database": "stalwart",
      "authUsername": "stalwart",
      "authSecret": {
        "@type": "EnvironmentVariable",
        "variableName": "STALWART_DB_PASSWORD"
      }
    }
  bootstrap.ndjson: |
    {"@type":"update","object":"BlobStore","value":{"@type":"S3","region":{"@type":"Custom","customEndpoint":"http://${GARAGE_S3_IP}:${GARAGE_S3_PORT}","customRegion":"${GARAGE_S3_CUSTOM_REGION}"},"bucket":"${GARAGE_S3_BUCKET}","accessKey":{"@type":"EnvironmentVariable","variableName":"STALWART_S3_ACCESS_KEY"},"secretKey":{"@type":"EnvironmentVariable","variableName":"STALWART_S3_SECRET_KEY"},"securityToken":{"@type":"None"},"sessionToken":{"@type":"None"},"verifyAfterWrite":true}}
    {"@type":"update","object":"SearchStore","value":{"@type":"ElasticSearch","url":"http://elasticsearch.stalwart.svc.cluster.local:9200","numShards":1,"numReplicas":1,"includeSource":false,"httpAuth":{"@type":"Unauthenticated"}}}
    {"@type":"update","object":"InMemoryStore","value":{"@type":"RedisSentinel","urls":{"redis://redis-0.redis.stalwart.svc.cluster.local:26379":true,"redis://redis-1.redis.stalwart.svc.cluster.local:26379":true,"redis://redis-sentinel-2.stalwart.svc.cluster.local:26379":true},"serviceName":"stalwart","authUsername":"default","authSecret":{"@type":"EnvironmentVariable","variableName":"STALWART_REDIS_PASSWORD"},"sentinelUsername":"default","sentinelSecret":{"@type":"EnvironmentVariable","variableName":"STALWART_REDIS_PASSWORD"},"protocolVersion":"resp3"}}
    {"@type":"reconcile","object":"Certificate","matchOn":["certificate"],"value":{"mail":{"certificate":{"@type":"File","filePath":"/etc/stalwart/tls/tls.crt"},"privateKey":{"@type":"File","filePath":"/etc/stalwart/tls/tls.key"}}}}
    {"@type":"upsert","object":"ClusterRole","matchOn":["name"],"value":{"cluster-role-mail":{"name":"mail","description":"Runs all mail listeners and background tasks","tasks":{"@type":"EnableAll"},"listeners":{"@type":"EnableAll"}}}}
    {"@type":"update","object":"SystemSettings","value":{"defaultHostname":"${MAIL_HOST}","defaultCertificateId":"#mail","mailExchangers":{"0":{"hostname":"${MAIL_HOST}","priority":10}},"services":{"caldav":{"hostname":"${MAIL_HOST}","cleartext":false},"carddav":{"hostname":"${MAIL_HOST}","cleartext":false},"imap":{"hostname":"${MAIL_HOST}","cleartext":false},"jmap":{"hostname":"${MAIL_HOST}","cleartext":false},"managesieve":{"hostname":"${MAIL_HOST}","cleartext":false},"pop3":{"hostname":"${MAIL_HOST}","cleartext":false},"smtp":{"hostname":"${MAIL_HOST}","cleartext":false},"webdav":{"hostname":"${MAIL_HOST}","cleartext":false}}}}
    {"@type":"upsert","object":"Domain","matchOn":["name"],"value":{"domain":{"name":"${MAIL_DOMAIN}","aliases":{},"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Manual"},"subAddressing":{"@type":"Enabled"}}}}
    {"@type":"update","object":"SystemSettings","value":{"defaultDomainId":"#domain"}}
    {"@type":"update","object":"Coordinator","value":{"@type":"Default"}}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    metallb.io/loadBalancerIPs: ${INGRESS_LOAD_BALANCER_IP}
    metallb.io/allow-shared-ip: antblu-net
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: smtps
      port: 465
      targetPort: smtps
    - name: submission
      port: 587
      targetPort: submission
    - name: imap
      port: 143
      targetPort: imap
    - name: imaps
      port: 993
      targetPort: imaps
    - name: pop3
      port: 110
      targetPort: pop3
    - name: pop3s
      port: 995
      targetPort: pop3s
    - name: sieve
      port: 4190
      targetPort: sieve
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-web
  namespace: stalwart
spec:
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: management
      port: 8080
      targetPort: management
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${MAIL_HOST}
      secretName: mail-tls
  rules:
    - host: ${MAIL_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart-web
                port:
                  name: management
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-headless
  namespace: stalwart
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: management
      port: 8080
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
spec:
  serviceName: stalwart-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_RIGHT}
                      - ${TALOS_WORKER_LEFT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: stalwart
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:${STALWART_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-db-app
                  key: password
            - name: STALWART_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-storage
                  key: s3-access-key
            - name: STALWART_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-storage
                  key: s3-secret-key
            - name: STALWART_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-redis
                  key: password
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-bootstrap-admin
                  key: credential
            - name: STALWART_PUBLIC_URL
              value: https://${MAIL_HOST}
            # A multi-replica deployment must use an explicit cluster role.
            - name: STALWART_ROLE
              value: mail
            # Keep the node-ID lease tied to the StatefulSet pod identity.
            - name: STALWART_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
            - name: pop3
              containerPort: 110
            - name: pop3s
              containerPort: 995
            - name: sieve
              containerPort: 4190
            - name: https
              containerPort: 443
            - name: management
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: management
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/stalwart
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tls
          secret:
            secretName: mail-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stalwart
  namespace: stalwart
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-bootstrap
  namespace: stalwart
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: stalwart-cli
          image: ghcr.io/stalwartlabs/cli:${STALWART_CLI_IMAGE_TAG}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          args:
            - apply
            - --file
            - /config/bootstrap.ndjson
            - --quiet
          env:
            - name: STALWART_URL
              value: http://stalwart-web.stalwart.svc.cluster.local:8080
            - name: STALWART_USER
              value: admin
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-bootstrap-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stalwart-config
