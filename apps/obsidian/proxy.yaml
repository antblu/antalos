apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-haproxy
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-haproxy
    app.kubernetes.io/part-of: obsidian
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsidian-haproxy
        app.kubernetes.io/part-of: obsidian
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: obsidian-haproxy
              topologyKey: kubernetes.io/hostname
      containers:
        - name: haproxy
          image: haproxy:${COUCHDB_HAPROXY_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: COUCHDB_PROXY_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  name: obsidian-couchdb-auth
                  key: proxy-secret-base64
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: obsidian-haproxy-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: obsidian-haproxy
  namespace: obsidian
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-haproxy
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-haproxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: obsidian-haproxy
  ports:
    - name: http
      port: 5984
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-couchdb
  namespace: obsidian
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    maxResponseBodySize: 4194304
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-embedded-outpost
  namespace: obsidian
spec:
  type: ExternalName
  externalName: authentik-server.authentik.svc.cluster.local
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: obsidian
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian-haproxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`${OBSIDIAN_HOST}`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - kind: Service
          name: authentik-embedded-outpost
          port: 80
    - kind: Rule
      match: Host(`${OBSIDIAN_HOST}`)
      priority: 10
      middlewares:
        - name: authentik-couchdb
      services:
        - kind: Service
          name: obsidian
          port: 5984
  tls:
    secretName: obsidian-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-haproxy-ingress
  namespace: obsidian
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: obsidian-haproxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
