apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-couchdb-config
  namespace: obsidian
data:
  10-obsidian.ini: |
    [couchdb]
    single_node = true

    [cluster]
    n = 1
    q = 1

    [chttpd]
    bind_address = 0.0.0.0
    require_valid_user = true
    authentication_handlers = {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, proxy_authentication_handler}, {chttpd_auth, default_authentication_handler}

    [chttpd_auth]
    proxy_use_secret = true
    hash_algorithms = sha256,sha

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    credentials = true
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    methods = GET, PUT, POST, HEAD, DELETE
    headers = accept, authorization, content-type, origin, referer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-haproxy-config
  namespace: obsidian
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      set-var proc.couchdb_proxy_secret env(COUCHDB_PROXY_SECRET_BASE64)

    defaults
      log global
      mode http
      option httplog
      option http-keep-alive
      timeout connect 5s
      timeout client 60s
      timeout server 60s

    resolvers kubernetes
      nameserver coredns 10.96.0.10:53
      resolve_retries 3
      timeout resolve 1s
      timeout retry 1s
      hold valid 10s
      hold nx 3s
      hold other 3s

    frontend couchdb
      bind :8080
      acl authentik_user req.hdr(X-authentik-username) -m found
      http-request del-header X-Auth-CouchDB-UserName
      http-request del-header X-Auth-CouchDB-Roles
      http-request del-header X-Auth-CouchDB-Token
      http-request set-header X-Auth-CouchDB-UserName %[req.hdr(X-authentik-username)] if authentik_user
      http-request set-header X-Auth-CouchDB-Roles _admin if authentik_user
      http-request set-header X-Auth-CouchDB-Token %[req.hdr(X-authentik-username),hmac(sha256,proc.couchdb_proxy_secret),hex] if authentik_user
      default_backend couchdb_replicas

    backend couchdb_replicas
      server couchdb-0 obsidian-couchdb-0.obsidian-couchdb.obsidian.svc.cluster.local:5984 check inter 3s fall 3 rise 2 resolvers kubernetes init-addr libc,none
      server couchdb-1 obsidian-couchdb-1.obsidian-couchdb.obsidian.svc.cluster.local:5984 check inter 3s fall 3 rise 2 resolvers kubernetes init-addr libc,none backup
