apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-couchdb-config
  namespace: obsidian
data:
  10-obsidian.ini: |
    [couchdb]
    single_node = true

    [chttpd]
    bind_address = 0.0.0.0
    require_valid_user = true

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    credentials = true
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    methods = GET, PUT, POST, HEAD, DELETE
    headers = accept, authorization, content-type, origin, referer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-haproxy-config
  namespace: obsidian
data:
  haproxy.cfg: |
    global
      log stdout format raw local0

    defaults
      log global
      mode http
      option httplog
      option http-keep-alive
      timeout connect 5s
      timeout client 60s
      timeout server 60s

    frontend couchdb
      bind :8080
      default_backend couchdb_replicas

    backend couchdb_replicas
      option httpchk GET /_up
      http-check expect status 200
      server couchdb-0 obsidian-couchdb-0.obsidian-couchdb.obsidian.svc.cluster.local:5984 check inter 3s fall 3 rise 2
      server couchdb-1 obsidian-couchdb-1.obsidian-couchdb.obsidian.svc.cluster.local:5984 check inter 3s fall 3 rise 2 backup
