apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-lapi-data
spec:
  capacity:
    storage: ${CROWDSEC_LAPI_DATA_STORAGE_SIZE}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: crowdsec-lapi-data
    namespace: crowdsec
  mountOptions:
    - nfsvers=3
    - hard
    - nolock
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: crowdsec-lapi-data
    volumeAttributes:
      server: ${NFS_SERVER}
      share: ${CROWDSEC_LAPI_NFS_SHARE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-lapi-data
  namespace: crowdsec
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: crowdsec-lapi-data
  resources:
    requests:
      storage: ${CROWDSEC_LAPI_DATA_STORAGE_SIZE}
