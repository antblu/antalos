apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgejo-repositories
spec:
  capacity:
    storage: ${FORGEJO_REPO_STORAGE_SIZE}
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: forgejo-repositories
    namespace: forgejo
  mountOptions:
  - nfsvers=4.1
  - hard
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: forgejo-repositories
    volumeAttributes:
      server: ${NFS_SERVER}
      share: ${FORGEJO_NFS_SHARE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-repositories
  namespace: forgejo
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  volumeName: forgejo-repositories
  resources:
    requests:
      storage: ${FORGEJO_REPO_STORAGE_SIZE}
