apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps/docs
    plugin:
      name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: docs
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: docs
      namespace: docs
      jsonPointers:
        - /spec/template/metadata/annotations/images.antblu.net~1published-image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
