apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-image-refresh
  namespace: docs
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - docs
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-image-refresh
  namespace: docs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: website-image-refresh
subjects:
  - kind: ServiceAccount
    name: website-image-refresh
    namespace: website-image-refresh
