apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: ${OPENEBS_CHART_VERSION}
      helm:
        values: |
          # LocalPV Hostpath provisioner.
          localpv-provisioner:
            localpv:
              enabled: true
              basePath: /var/mnt/openebs-local
              tolerations:
                - key: quorum
                  operator: Exists
                  effect: NoSchedule
              nodeDeployment:
                enabled: true
              allowInsecurePvcBasePathOverride: false
            hostpathClass:
              enabled: false

          engines:
            local:
              hostpath:
                enabled: true
              lvm:
                enabled: false
              zfs:
                enabled: false
              rawfile:
                enabled: false
            replicated:
              mayastor:
                enabled: false

          preUpgradeHook:
            enabled: false
          loki:
            enabled: false
          alloy:
            enabled: false

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/openebs
      plugin:
        name: yaml-envsubst

  destination:
    server: https://kubernetes.default.svc
    namespace: openebs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    # Node-deployment mode requires host filesystem access, but keeping this
    # exception on the storage namespace prevents application namespaces from
    # admitting privileged OpenEBS helper pods.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline

    syncOptions:
      - CreateNamespace=true
