apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: 4.5.1
      helm:
        valueFiles:
          - $values/apps/openebs/values.yaml

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      ref: values
      path: apps/openebs
      plugin:
        name: yaml-envsubst

  destination:
    server: https://kubernetes.default.svc
    namespace: openebs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    # Node-deployment mode requires host filesystem access, but keeping this
    # exception on the storage namespace prevents application namespaces from
    # admitting privileged OpenEBS helper pods.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline

    syncOptions:
      - CreateNamespace=true
