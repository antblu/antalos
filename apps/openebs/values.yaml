# LocalPV Hostpath provisioner.
localpv-provisioner:
  localpv:
    enabled: true
    replicas: 2
    enableLeaderElection: true

    basePath: /var/mnt/openebs-local

    # Provision volumes from a node-local DaemonSet instead of creating
    # privileged helper pods in application namespaces.
    nodeDeployment:
      enabled: true

    # Do not allow PVCs to override BasePath.
    allowInsecurePvcBasePathOverride: false

  # The StorageClass is managed in storageclass.yaml.
  hostpathClass:
    enabled: false

# The umbrella chart enables most engines by default. Keep only LocalPV
# Hostpath enabled; this cluster does not provide LVM, ZFS, RawFile, or
# Mayastor backing storage.
engines:
  local:
    hostpath:
      enabled: true
    lvm:
      enabled: false
    zfs:
      enabled: false
    rawfile:
      enabled: false
  replicated:
    mayastor:
      enabled: false

# This hook is only needed when upgrading OpenEBS v3 to v4.
preUpgradeHook:
  enabled: false

# Logging is unnecessary for a Hostpath-only installation.
loki:
  enabled: false

alloy:
  enabled: false
