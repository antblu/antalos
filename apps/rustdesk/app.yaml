apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustdesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps/rustdesk
    plugin:
      name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: rustdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
