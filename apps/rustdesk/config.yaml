apiVersion: v1
kind: ConfigMap
metadata:
  name: rustdesk-hbbs
  namespace: rustdesk
data:
  litestream.yml: |
    dbs:
      - path: /data/db_v2.sqlite3
        replica:
          path: /backup/hbbs-db
          sync-interval: 1s
  start.sh: |
    #!/tools/busybox sh
    set -eu
    # Keep the process lock on the writable pod-local data volume. The NFS
    # export is root-squashed and is used only for Litestream replication.
    exec 9>/data/hbbs.lock
    /tools/busybox flock -n 9
    /tools/litestream restore -config /config/litestream.yml -if-db-not-exists -if-replica-exists /data/db_v2.sqlite3
    exec /tools/litestream replicate -config /config/litestream.yml -exec "/usr/bin/hbbs -k _ -r ${RUSTDESK_HOST}:21117,${RUSTDESK_HOST}:21120"
