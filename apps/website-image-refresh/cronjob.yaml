apiVersion: v1
kind: ServiceAccount
metadata:
  name: website-image-refresh
  namespace: website-image-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-image-refresh
  namespace: website-image-refresh
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: website-image-refresh
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: refresh
              image: python:${WEBSITE_IMAGE_REFRESH_PYTHON_IMAGE_TAG}
              command:
                - python
                - -B
                - /config/refresh.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: website-image-refresh
