apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-migrations
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${TALOS_WORKER_LEFT}
                - ${TALOS_WORKER_RIGHT}
      containers:
      - name: migrate
        image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG}
        workingDir: /app
        command:
        - python
        - litellm/proxy/prisma_migration.py
        env:
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: litellm-db-app
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-db-app
              key: password
        - name: DATABASE_HOST
          value: ${LITELLM_DATABASE_HOST}
        - name: DATABASE_URL
          value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/litellm?sslmode=require&connection_limit=10
        - name: DISABLE_SCHEMA_UPDATE
          value: 'false'
        - name: ENFORCE_PRISMA_MIGRATION_CHECK
          value: 'true'
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
