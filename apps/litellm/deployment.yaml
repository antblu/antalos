apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${TALOS_WORKER_LEFT}
                - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: litellm
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 90
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG}
        args:
        - --config
        - /etc/litellm/config.yaml
        - --port
        - '4000'
        - --num_workers
        - '1'
        env:
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: litellm-db-app
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-db-app
              key: password
        - name: DATABASE_HOST
          value: ${LITELLM_DATABASE_HOST}
        - name: DATABASE_URL
          value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/litellm?sslmode=require&connection_limit=10
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-app
              key: master-key
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-app
              key: salt-key
        - name: admin
        - name: UI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-app
              key: ui-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-redis
              key: password
        - name: STORE_MODEL_IN_DB
          value: 'True'
        - name: DISABLE_SCHEMA_UPDATE
          value: 'true'
        - name: LITELLM_LOG
          value: INFO
        - name: HOME
          value: /tmp
        ports:
        - name: http
          containerPort: 4000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
        startupProbe:
          httpGet:
            path: /health/liveliness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
  - name: http
    port: 4000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ${LITELLM_HOST}
    secretName: litellm-tls
  rules:
  - host: ${LITELLM_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: litellm
            port:
              name: http
