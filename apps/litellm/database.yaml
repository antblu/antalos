apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:${POSTGRES_IMAGE_TAG}
  enableSuperuserAccess: false
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${TALOS_WORKER_LEFT}
            - ${TALOS_WORKER_RIGHT}
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    storageClass: openebs-local
    size: ${LITELLM_DATABASE_STORAGE_SIZE}
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      secret:
        name: litellm-db-app
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
