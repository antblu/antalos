apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja-worker
  namespace: invoiceninja
  labels:
    app.kubernetes.io/name: invoiceninja-worker
    app.kubernetes.io/part-of: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceninja-worker
        app.kubernetes.io/part-of: invoiceninja
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3600
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: invoiceninja-worker
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: invoiceninja/invoiceninja-debian:${INVOICENINJA_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          workingDir: /var/www/html
          command:
            - runuser
            - -u
            - www-data
            - --
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600
            - --verbose
          envFrom:
            - configMapRef:
                name: invoiceninja-config
            - secretRef:
                name: invoiceninja-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            capabilities:
              add:
                - SETGID
                - SETUID
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: invoiceninja-worker
  namespace: invoiceninja
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja-worker
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invoiceninja-scheduler
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invoiceninja-scheduler
            app.kubernetes.io/part-of: invoiceninja
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - ${TALOS_WORKER_LEFT}
                          - ${TALOS_WORKER_RIGHT}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduler
              image: invoiceninja/invoiceninja-debian:${INVOICENINJA_IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              workingDir: /var/www/html
              command:
                - runuser
                - -u
                - www-data
                - --
                - php
                - artisan
                - schedule:run
                - --verbose
                - --no-interaction
              envFrom:
                - configMapRef:
                    name: invoiceninja-config
                - secretRef:
                    name: invoiceninja-app
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: false
                capabilities:
                  add:
                    - SETGID
                    - SETUID
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
