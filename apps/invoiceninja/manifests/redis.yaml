apiVersion: v1
kind: ConfigMap
metadata:
  name: invoiceninja-redis-config
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  discover-master.sh: |
    #!/bin/sh
    for sentinel in ${INVOICENINJA_REDIS_DATA_0_HOST} ${INVOICENINJA_REDIS_DATA_1_HOST} ${INVOICENINJA_REDIS_SENTINEL_2_HOST}; do
      reply=$(REDISCLI_AUTH="$REDIS_PASSWORD" timeout 3 redis-cli --raw -h "$sentinel" -p 26379 SENTINEL get-master-addr-by-name invoiceninja 2>/dev/null) || continue
      set -- $reply
      if [ "$#" -eq 2 ] && [ "$2" = 6379 ]; then
        printf "%s %s\n" "$1" "$2"
        exit 0
      fi
    done
    exit 1
  start-redis.sh: |
    #!/bin/sh
    set -eu
    umask 077
    mkdir -p /data/redis
    config=/data/redis/redis.conf
    if [ ! -f "$config" ]; then
      cat > "$config" <<EOF
    port 6379
    dir /data/redis
    appendonly yes
    appendfsync everysec
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    masterauth "$REDIS_PASSWORD"
    replica-announce-ip $POD_DNS
    replica-announce-port 6379
    EOF
      if [ "$HOSTNAME" = invoiceninja-redis-data-1 ]; then
        printf "replicaof %s 6379\n" "${INVOICENINJA_REDIS_DATA_0_HOST}" >> "$config"
      fi
    fi
    master=$(/config/discover-master.sh) || master=""
    if [ -n "$master" ]; then
      set -- $master
      sed -i "/^replicaof /d; /^slaveof /d" "$config"
      if [ "$1" != "$POD_DNS" ] && [ "$1" != "$POD_IP" ]; then
        printf "replicaof %s %s\n" "$1" "$2" >> "$config"
      fi
    fi
    exec redis-server "$config"
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    umask 077
    mkdir -p /data/sentinel
    config=/data/sentinel/sentinel.conf
    if [ ! -f "$config" ]; then
      master=$(/config/discover-master.sh) || master="${INVOICENINJA_REDIS_DATA_0_HOST} 6379"
      set -- $master
      cat > "$config" <<EOF
    port 26379
    protected-mode no
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $POD_DNS
    sentinel announce-port 26379
    sentinel monitor invoiceninja $1 $2 2
    sentinel auth-pass invoiceninja "$REDIS_PASSWORD"
    sentinel down-after-milliseconds invoiceninja 5000
    sentinel failover-timeout invoiceninja 60000
    sentinel parallel-syncs invoiceninja 1
    EOF
    fi
    sed -i '/^requirepass /d; /^sentinel sentinel-pass /d' "$config"
    exec redis-sentinel "$config"
---
apiVersion: v1
kind: Service
metadata:
  name: invoiceninja-redis-data
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: invoiceninja-redis-data
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: invoiceninja-redis-data
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: invoiceninja-redis-data
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja-redis-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceninja-redis-data
        invoiceninja.antblu.net/sentinel: "true"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: invoiceninja-redis-data
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - sh
            - -ec
            - case "$HOSTNAME" in invoiceninja-redis-data-0) export POD_DNS="$DATA_0_HOST" ;; *) export POD_DNS="$DATA_1_HOST" ;; esac; exec /config/start-redis.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-app
                  key: REDIS_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATA_0_HOST
              value: ${INVOICENINJA_REDIS_DATA_0_HOST}
            - name: DATA_1_HOST
              value: ${INVOICENINJA_REDIS_DATA_1_HOST}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - sh
            - -ec
            - case "$HOSTNAME" in invoiceninja-redis-data-0) export POD_DNS="$DATA_0_HOST" ;; *) export POD_DNS="$DATA_1_HOST" ;; esac; exec /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-app
                  key: REDIS_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATA_0_HOST
              value: ${INVOICENINJA_REDIS_DATA_0_HOST}
            - name: DATA_1_HOST
              value: ${INVOICENINJA_REDIS_DATA_1_HOST}
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -p 26379 ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: invoiceninja-redis-config
            defaultMode: 365
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${INVOICENINJA_REDIS_STORAGE_SIZE}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: invoiceninja-redis-data
  namespace: invoiceninja
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: invoiceninja-redis-sentinel-2
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: invoiceninja-redis-quorum
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja-redis-quorum
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceninja-redis-quorum
        invoiceninja.antblu.net/sentinel: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - key: quorum
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-app
                  key: REDIS_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_DNS
              value: ${INVOICENINJA_REDIS_SENTINEL_2_HOST}
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -p 26379 ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: invoiceninja-redis-config
            defaultMode: 365
        - name: data
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: invoiceninja-redis-quorum
  namespace: invoiceninja
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceninja-redis-quorum
