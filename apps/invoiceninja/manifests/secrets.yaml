apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: invoiceninja-app
  namespace: invoiceninja
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  encryptedData:
    APP_KEY: 
    AWS_SECRET_ACCESS_KEY: 
    DB_PASSWORD: 
    IN_PASSWORD: 
    MAIL_PASSWORD: 
    REDIS_PASSWORD: 
  template:
    metadata:
      name: invoiceninja-app
      namespace: invoiceninja
      annotations:
        argocd.argoproj.io/sync-wave: "-7"
    type: Opaque
