apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "invoiceninja.fullname" . }}-config
  labels:
    {{- include "invoiceninja.labels" . | nindent 4 }}
data:
  APP_URL: {{ .Values.env.appUrl | quote }}
  APP_ENV: {{ .Values.env.appEnv | quote }}
  APP_DEBUG: {{ .Values.env.appDebug | quote }}
  REQUIRE_HTTPS: {{ .Values.env.requireHttps | quote }}
  PHANTOMJS_PDF_GENERATION: {{ .Values.env.phantomjsPdfGeneration | quote }}
  PDF_GENERATOR: {{ .Values.env.pdfGenerator | quote }}
  TRUSTED_PROXIES: {{ .Values.env.trustedProxies | quote }}
  CACHE_DRIVER: {{ .Values.env.cacheDriver | quote }}
  QUEUE_CONNECTION: {{ .Values.env.queueConnection | quote }}
  SESSION_DRIVER: {{ .Values.env.sessionDriver | quote }}
  REDIS_HOST: {{ .Values.external.redisSentinels | quote }}
  REDIS_PORT: {{ .Values.external.redisSentinelPorts | quote }}
  REDIS_SENTINEL_SERVICE: {{ .Values.external.redisSentinelService | quote }}
  REDIS_QUEUE_CONNECTION: {{ .Values.env.redisQueueConnection | quote }}
  REDIS_CACHE_CONNECTION: {{ .Values.env.redisCacheConnection | quote }}
  SESSION_CONNECTION: {{ .Values.env.sessionConnection | quote }}
  FILESYSTEM_DISK: {{ .Values.env.filesystemDisk | quote }}
  DB_HOST: {{ .Values.external.databaseHost | quote }}
  DB_PORT: {{ .Values.external.databasePort | quote }}
  DB_DATABASE: {{ .Values.env.dbDatabase | quote }}
  DB_USERNAME: {{ .Values.env.dbUsername | quote }}
  DB_CONNECTION: {{ .Values.env.dbConnection | quote }}
  IN_USER_EMAIL: {{ .Values.env.initialUserEmail | quote }}
  MAIL_MAILER: {{ .Values.env.mailMailer | quote }}
  MAIL_HOST: {{ .Values.env.mailHost | quote }}
  MAIL_PORT: {{ .Values.env.mailPort | quote }}
  MAIL_USERNAME: {{ .Values.env.mailUsername | quote }}
  MAIL_ENCRYPTION: {{ .Values.env.mailEncryption | quote }}
  MAIL_FROM_ADDRESS: {{ .Values.env.mailFromAddress | quote }}
  MAIL_FROM_NAME: {{ .Values.env.mailFromName | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.env.s3AccessKeyId | quote }}
  AWS_DEFAULT_REGION: {{ .Values.env.s3Region | quote }}
  AWS_BUCKET: {{ .Values.env.s3Bucket | quote }}
  AWS_ENDPOINT: {{ .Values.env.s3Endpoint | quote }}
  AWS_USE_PATH_STYLE_ENDPOINT: {{ .Values.env.s3UsePathStyleEndpoint | quote }}
  IS_DOCKER: {{ .Values.env.isDocker | quote }}
  SCOUT_DRIVER: {{ .Values.env.scoutDriver | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "invoiceninja.fullname" . }}-nginx
  labels:
    {{- include "invoiceninja.labels" . | nindent 4 }}
data:
  invoiceninja.conf: |
    client_max_body_size 10M;
    client_body_buffer_size 10M;
    server_tokens off;
    fastcgi_buffers 32 16K;
    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types *;
  laravel.conf: |
    server {
        listen {{ .Values.nginx.containerPort }} default_server;
        server_name _;
        root /var/www/html/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass {{ include "invoiceninja.appServiceName" . }}:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "invoiceninja.fullname" . }}-supervisor
  labels:
    {{- include "invoiceninja.labels" . | nindent 4 }}
data:
  supervisord.conf: |
    [supervisord]
    nodaemon=true
    user=root
    logfile=/dev/null
    logfile_maxbytes=0
    pidfile=/var/run/supervisord.pid

    [program:php-fpm]
    command=/usr/local/sbin/php-fpm -F
    autostart=true
    autorestart=true
    priority=5
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    redirect_stderr=true
