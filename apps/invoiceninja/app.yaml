apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invoiceninja
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/invoiceninja/chart
      helm:
        releaseName: invoiceninja
        parameters:
          - name: app.image.tag
            value: ${INVOICENINJA_IMAGE_TAG}
          - name: app.busyboxTag
            value: ${INVOICENINJA_BUSYBOX_IMAGE_TAG}
          - name: nginx.image.tag
            value: ${INVOICENINJA_NGINX_IMAGE_TAG}
          - name: external.databaseHost
            value: ${INVOICENINJA_DATABASE_HOST}
          - name: external.redisSentinels
            value: ${INVOICENINJA_REDIS_DATA_0_HOST}\,${INVOICENINJA_REDIS_DATA_1_HOST}\,${INVOICENINJA_REDIS_SENTINEL_2_HOST}
          - name: env.appUrl
            value: https://${INVOICENINJA_HOST}
          - name: env.initialUserEmail
            value: ${INVOICENINJA_INITIAL_USER_EMAIL}
          - name: env.mailMailer
            value: smtp
          - name: env.mailHost
            value: ${INVOICENINJA_MAIL_HOST}
          - name: env.mailPort
            value: "${INVOICENINJA_MAIL_PORT}"
          - name: env.mailUsername
            value: ${INVOICENINJA_MAIL_USERNAME}
          - name: env.mailEncryption
            value: ${INVOICENINJA_MAIL_ENCRYPTION}
          - name: env.mailFromAddress
            value: ${INVOICENINJA_MAIL_FROM_ADDRESS}
          - name: env.mailFromName
            value: ${INVOICENINJA_MAIL_FROM_NAME}
          - name: env.s3AccessKeyId
            value: ${INVOICENINJA_S3_ACCESS_KEY_ID}
          - name: env.s3Region
            value: ${GARAGE_S3_CUSTOM_REGION}
          - name: env.s3Bucket
            value: ${INVOICENINJA_S3_BUCKET}
          - name: env.s3Endpoint
            value: http://${GARAGE_S3_IP}:${GARAGE_S3_PORT}
          - name: ingress.hosts[0].host
            value: ${INVOICENINJA_HOST}
          - name: ingress.hosts[0].paths[0].path
            value: /
          - name: ingress.hosts[0].paths[0].pathType
            value: Prefix
          - name: ingress.tls[0].hosts[0]
            value: ${INVOICENINJA_HOST}
        valuesObject:
          app:
            replicaCount: 2
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - ${TALOS_WORKER_LEFT}
                            - ${TALOS_WORKER_RIGHT}
                            - ${TALOS_WORKER_RTX}
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: invoiceninja
                        app.kubernetes.io/component: app
                    topologyKey: kubernetes.io/hostname
          nginx:
            replicaCount: 2
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 256Mi
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - ${TALOS_WORKER_LEFT}
                            - ${TALOS_WORKER_RIGHT}
                            - ${TALOS_WORKER_RTX}
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: invoiceninja
                        app.kubernetes.io/component: nginx
                    topologyKey: kubernetes.io/hostname
          tolerations:
            - key: quorum
              operator: Exists
              effect: NoSchedule
          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            tls:
              - hosts:
                  - ${INVOICENINJA_HOST}
                secretName: invoiceninja-tls
    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/invoiceninja/manifests
      plugin:
        name: yaml-envsubst
        env:
          - name: INVOICENINJA_HOST
            value: ${INVOICENINJA_HOST}
          - name: INVOICENINJA_IMAGE_TAG
            value: ${INVOICENINJA_IMAGE_TAG}
          - name: INVOICENINJA_MARIADB_IMAGE_TAG
            value: ${INVOICENINJA_MARIADB_IMAGE_TAG}
          - name: INVOICENINJA_GARBD_IMAGE_TAG
            value: ${INVOICENINJA_GARBD_IMAGE_TAG}
          - name: INVOICENINJA_DATABASE_STORAGE_SIZE
            value: ${INVOICENINJA_DATABASE_STORAGE_SIZE}
          - name: INVOICENINJA_REDIS_DATA_0_HOST
            value: ${INVOICENINJA_REDIS_DATA_0_HOST}
          - name: INVOICENINJA_REDIS_DATA_1_HOST
            value: ${INVOICENINJA_REDIS_DATA_1_HOST}
          - name: INVOICENINJA_REDIS_SENTINEL_2_HOST
            value: ${INVOICENINJA_REDIS_SENTINEL_2_HOST}
          - name: INVOICENINJA_REDIS_STORAGE_SIZE
            value: ${INVOICENINJA_REDIS_STORAGE_SIZE}
          - name: REDIS_IMAGE_TAG
            value: ${REDIS_IMAGE_TAG}
          - name: TALOS_WORKER_LEFT
            value: ${TALOS_WORKER_LEFT}
          - name: TALOS_WORKER_RIGHT
            value: ${TALOS_WORKER_RIGHT}
          - name: TALOS_WORKER_RTX
            value: ${TALOS_WORKER_RTX}
  destination:
    server: https://kubernetes.default.svc
    namespace: invoiceninja
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
