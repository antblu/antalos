apiVersion: v1
kind: PersistentVolume
metadata:
  name: drupal-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-6'
spec:
  capacity:
    storage: ${DRUPAL_DATA_STORAGE_SIZE}
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    name: drupal-data
    namespace: drupal
  mountOptions:
  - nfsvers=4
  - hard
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: drupal-data-nfs-v1
    volumeAttributes:
      server: ${DRUPAL_NFS_SERVER}
      share: ${DRUPAL_NFS_SHARE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drupal-data
  namespace: drupal
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-6'
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: drupal-data
  resources:
    requests:
      storage: ${DRUPAL_DATA_STORAGE_SIZE}
