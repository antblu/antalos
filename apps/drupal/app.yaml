apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drupal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps/drupal
    plugin:
      name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: drupal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: batch
    kind: Job
    name: drupal-install-v2
    namespace: drupal
    jsonPointers:
    - /spec/template
  - group: batch
    kind: Job
    name: drupal-configure-v2
    namespace: drupal
    jsonPointers:
    - /spec/template
