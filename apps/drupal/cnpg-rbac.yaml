apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drupal-cnpg-role-binding
  namespace: drupal
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  resourceNames:
  - drupal-db
  verbs:
  - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drupal-cnpg-role-binding
  namespace: drupal
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drupal-cnpg-role-binding
subjects:
- kind: ServiceAccount
  name: cnpg-operator-cloudnative-pg
  namespace: cnpg-system
