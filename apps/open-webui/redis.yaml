apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-redis-config
  namespace: open-webui
data:
  start-redis.sh: |
    #!/bin/sh
    set -eu
    set -- redis-server \
      --appendonly yes \
      --appendfsync everysec \
      --requirepass "$REDIS_PASSWORD" \
      --masterauth "$REDIS_PASSWORD" \
      --protected-mode no \
      --timeout 1800 \
      --maxclients 10000
    if [ "$HOSTNAME" = open-webui-redis-data-1 ]; then
      set -- "$@" --replicaof ${OPEN_WEBUI_REDIS_DATA_0_HOST} 6379
    fi
    exec "$@"
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    cat > /tmp/sentinel.conf <<SENTINEL
    port 26379
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor open-webui ${OPEN_WEBUI_REDIS_DATA_0_HOST} 6379 2
    sentinel auth-pass open-webui "$REDIS_PASSWORD"
    sentinel down-after-milliseconds open-webui 5000
    sentinel failover-timeout open-webui 60000
    sentinel parallel-syncs open-webui 1
    SENTINEL
    exec redis-sentinel /tmp/sentinel.conf
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-redis-data
  namespace: open-webui
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: open-webui-redis-data
  ports:
    - {name: redis, port: 6379, targetPort: redis}
    - {name: sentinel, port: 26379, targetPort: sentinel}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-webui-redis-data
  namespace: open-webui
spec:
  serviceName: open-webui-redis-data
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui-redis-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui-redis-data
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [${TALOS_WORKER_LEFT}, ${TALOS_WORKER_RIGHT}]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: open-webui-redis-data
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command: [/config/start-redis.sh]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: open-webui-redis, key: password}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: [sh, -ec, 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG']
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command: [/config/start-sentinel.sh]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: open-webui-redis, key: password}
          ports:
            - {name: sentinel, containerPort: 26379}
          readinessProbe:
            exec:
              command: [sh, -ec, 'redis-cli --no-auth-warning -p 26379 -a "$REDIS_PASSWORD" ping | grep PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap:
            name: open-webui-redis-config
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${OPEN_WEBUI_REDIS_STORAGE_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-redis-sentinel-2
  namespace: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui-redis-quorum
  ports:
    - {name: sentinel, port: 26379, targetPort: sentinel}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-redis-quorum
  namespace: open-webui
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui-redis-quorum
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - {key: quorum, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command: [/config/start-sentinel.sh]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: open-webui-redis, key: password}
          ports:
            - {name: sentinel, containerPort: 26379}
          readinessProbe:
            exec:
              command: [sh, -ec, 'redis-cli --no-auth-warning -p 26379 -a "$REDIS_PASSWORD" ping | grep PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: ${OPEN_WEBUI_REDIS_QUORUM_CPU_REQUEST}
              memory: ${OPEN_WEBUI_REDIS_QUORUM_MEMORY_REQUEST}
            limits:
              cpu: ${OPEN_WEBUI_REDIS_QUORUM_CPU_LIMIT}
              memory: ${OPEN_WEBUI_REDIS_QUORUM_MEMORY_LIMIT}
          volumeMounts:
            - {name: config, mountPath: /config}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap:
            name: open-webui-redis-config
            defaultMode: 0555
