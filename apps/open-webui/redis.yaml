apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-redis-config
  namespace: open-webui
data:
  discover-master.sh: |
    #!/bin/sh
    votes=""
    for peer in open-webui-redis-data-0.open-webui-redis-data.open-webui.svc.cluster.local open-webui-redis-data-1.open-webui-redis-data.open-webui.svc.cluster.local open-webui-redis-sentinel-2.open-webui.svc.cluster.local; do
      reply=$(timeout 3 redis-cli --raw -h "$peer" -p 26379 SENTINEL get-master-addr-by-name open-webui 2>/dev/null) || continue
      set -- $reply
      if [ "$#" -eq 2 ] && [ "$2" = 6379 ]; then
        votes="$votes
    $1 $2"
      fi
    done
    # A single stale voter must not resurrect a former primary after failover.
    master=$(printf '%s\n' "$votes" | sort | uniq -c | awk '$1 >= 2 { print $2, $3; exit }')
    [ -n "$master" ] || exit 1
    printf '%s\n' "$master"
  start-redis.sh: |
    #!/bin/sh
    set -eu
    umask 077
    config=/data/redis.conf
    master=$(/config/discover-master.sh) || master=""
    if [ ! -s "$config" ]; then
      # Do not guess a writer while migrating an existing dataset without voters.
      if [ -z "$master" ] && { [ -d /data/appendonlydir ] || [ -f /data/dump.rdb ] || [ -f /data/appendonly.aof ]; }; then
        echo 'Existing Redis data requires agreement from two Sentinels before first config migration' >&2
        exit 1
      fi
      cat > "$config" <<REDIS
    dir /data
    appendonly yes
    appendfsync everysec
    requirepass "$REDIS_PASSWORD"
    masterauth "$REDIS_PASSWORD"
    protected-mode no
    replica-announce-ip $HOSTNAME.open-webui-redis-data.open-webui.svc.cluster.local
    timeout 1800
    maxclients 10000
    REDIS
      if [ "$HOSTNAME" = open-webui-redis-data-1 ]; then
        printf 'replicaof %s 6379\n' 'open-webui-redis-data-0.open-webui-redis-data.open-webui.svc.cluster.local' >> "$config"
      fi
    fi
    # Existing members fail closed without agreement from two voters. Sentinels
    # start independently, including during a full-cluster recovery.
    if [ -z "$master" ] && { [ -d /data/appendonlydir ] || [ -f /data/dump.rdb ] || [ -f /data/appendonly.aof ]; }; then
      echo 'Existing Redis data requires agreement from two Sentinels before restart' >&2
      exit 1
    fi
    # Sentinel can now persist promotion/demotion with CONFIG REWRITE.
    if [ -n "$master" ]; then
      set -- $master
      sed -i '/^replicaof /d; /^slaveof /d' "$config"
      if [ "$1" != "$HOSTNAME.open-webui-redis-data.open-webui.svc.cluster.local" ] && [ "$1" != "$(hostname -i)" ]; then
        printf 'replicaof %s %s\n' "$1" "$2" >> "$config"
      fi
    fi
    exec redis-server "$config"
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    umask 077
    case "$HOSTNAME" in
      open-webui-redis-data-0|open-webui-redis-data-1)
        announce="$HOSTNAME.open-webui-redis-data.open-webui.svc.cluster.local"
        config=/sentinel/sentinel.conf
        ;;
      *)
        announce=open-webui-redis-sentinel-2.open-webui.svc.cluster.local
        config=/tmp/sentinel.conf
        ;;
    esac
    if [ ! -s "$config" ]; then
      master=$(/config/discover-master.sh) || master="open-webui-redis-data-0.open-webui-redis-data.open-webui.svc.cluster.local 6379"
      set -- $master
      myid=$(printf '%s' "$announce" | sha1sum | cut -d ' ' -f 1)
      cat > "$config" <<SENTINEL
    port 26379
    protected-mode no
    # Preserve the unauthenticated Sentinel listener required by this client.
    sentinel myid $myid
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $announce
    sentinel monitor open-webui $1 $2 2
    sentinel auth-pass open-webui "$REDIS_PASSWORD"
    sentinel down-after-milliseconds open-webui 5000
    sentinel failover-timeout open-webui 60000
    sentinel parallel-syncs open-webui 1
    SENTINEL
    fi
    exec redis-sentinel "$config"
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-redis-data
  namespace: open-webui
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: open-webui-redis-data
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-webui-redis-data
  namespace: open-webui
spec:
  serviceName: open-webui-redis-data
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui-redis-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui-redis-data
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: open-webui-redis-data
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-redis.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -p 26379 -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /sentinel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: open-webui-redis-config
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${OPEN_WEBUI_REDIS_STORAGE_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-redis-sentinel-2
  namespace: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui-redis-quorum
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-redis-quorum
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui-redis-quorum
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - key: quorum
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -p 26379 -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: ${OPEN_WEBUI_REDIS_QUORUM_CPU_REQUEST}
              memory: ${OPEN_WEBUI_REDIS_QUORUM_MEMORY_REQUEST}
            limits:
              cpu: ${OPEN_WEBUI_REDIS_QUORUM_CPU_LIMIT}
              memory: ${OPEN_WEBUI_REDIS_QUORUM_MEMORY_LIMIT}
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: open-webui-redis-config
            defaultMode: 0555
