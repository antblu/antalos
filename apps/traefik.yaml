apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Antblue/antalos.git
    targetRevision: HEAD
    path: charts/traefik           # Points to this repo
    helm:
      chart: traefik               # The actual chart comes from:
      repoURL: https://traefik.github.io/charts
      targetRevision: "34.0.0"     # Pin the version
      valueFiles:
        - values.yaml              # Your custom values live in the repo
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true       # ArgoCD creates the namespace if missing