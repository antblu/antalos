apiVersion: v1
kind: ConfigMap
metadata:
  name: activepieces-config
  namespace: activepieces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  AP_DB_TYPE: POSTGRES
  AP_POSTGRES_DATABASE: activepieces
  AP_POSTGRES_HOST: ${ACTIVEPIECES_DATABASE_HOST}
  AP_POSTGRES_PORT: "5432"
  AP_POSTGRES_USERNAME: activepieces
  AP_POSTGRES_USE_SSL: "false"
  AP_REDIS_TYPE: SENTINEL
  AP_REDIS_SENTINEL_HOSTS: ${ACTIVEPIECES_REDIS_DATA_0_HOST}:26379,${ACTIVEPIECES_REDIS_DATA_1_HOST}:26379,${ACTIVEPIECES_REDIS_SENTINEL_2_HOST}:26379
  AP_REDIS_SENTINEL_NAME: activepieces
  AP_REDIS_SENTINEL_ROLE: master
  AP_REDIS_USE_SSL: "false"
  AP_FILE_STORAGE_LOCATION: S3
  AP_S3_BUCKET: ${ACTIVEPIECES_S3_BUCKET}
  AP_S3_ACCESS_KEY_ID: GK7d0a3e590650b4703e4d37d5
  AP_S3_ENDPOINT: http://${GARAGE_S3_IP}:${GARAGE_S3_PORT}
  AP_S3_REGION: ${GARAGE_S3_CUSTOM_REGION}
  AP_S3_USE_SIGNED_URLS: "false"
  AP_ENVIRONMENT: prod
  AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
  AP_FRONTEND_URL: https://${ACTIVEPIECES_HOST}
  AP_TELEMETRY_ENABLED: "false"
