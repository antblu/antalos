apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: activepieces
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/activepieces/activepieces.git
      targetRevision: ${ACTIVEPIECES_CHART_SOURCE_REVISION}
      path: deploy/activepieces-helm
      helm:
        releaseName: activepieces
        valuesObject:
          workloadType: statefulset
          podManagementPolicy: Parallel
          replicaCount: 2
          image:
            repository: ghcr.io/activepieces/activepieces
            tag: ${ACTIVEPIECES_IMAGE_TAG}
          serviceAccount:
            create: true
            automount: false
          persistence:
            enabled: false
          activepiecesConfig:
            AP_CONTAINER_TYPE: APP
            AP_DB_TYPE: POSTGRES
            AP_POSTGRES_DATABASE: activepieces
            AP_POSTGRES_HOST: ${ACTIVEPIECES_DATABASE_HOST}
            AP_POSTGRES_PORT: "5432"
            AP_POSTGRES_USERNAME: activepieces
            AP_POSTGRES_USE_SSL: "true"
            AP_POSTGRES_POOL_SIZE: "10"
            AP_REDIS_TYPE: SENTINEL
            AP_REDIS_SENTINEL_HOSTS: ${ACTIVEPIECES_REDIS_DATA_0_HOST}:26379,${ACTIVEPIECES_REDIS_DATA_1_HOST}:26379,${ACTIVEPIECES_REDIS_SENTINEL_2_HOST}:26379
            AP_REDIS_SENTINEL_NAME: activepieces
            AP_REDIS_SENTINEL_ROLE: master
            AP_REDIS_USE_SSL: "false"
            AP_FILE_STORAGE_LOCATION: S3
            AP_S3_BUCKET: ${ACTIVEPIECES_S3_BUCKET}
            AP_S3_ACCESS_KEY_ID: GK7d0a3e590650b4703e4d37d5
            AP_S3_ENDPOINT: http://${GARAGE_S3_IP}:${GARAGE_S3_PORT}
            AP_S3_REGION: ${GARAGE_S3_CUSTOM_REGION}
            AP_S3_USE_SIGNED_URLS: "false"
            AP_ENVIRONMENT: prod
            AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
            AP_FRONTEND_URL: https://${ACTIVEPIECES_HOST}
            AP_TELEMETRY_ENABLED: "false"
          activepiecesEnvVariables:
            activepieces-config:
              - AP_ENCRYPTION_KEY
              - AP_JWT_SECRET
              - AP_POSTGRES_PASSWORD
              - AP_REDIS_PASSWORD
              - AP_S3_SECRET_ACCESS_KEY
          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - host: ${ACTIVEPIECES_HOST}
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: activepieces-tls
                hosts:
                  - ${ACTIVEPIECES_HOST}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - ${TALOS_WORKER_LEFT}
                          - ${TALOS_WORKER_RIGHT}
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: activepieces
                      app.kubernetes.io/instance: activepieces
                  topologyKey: kubernetes.io/hostname
          postgresql:
            enabled: false
          redis:
            enabled: false
          kubernetes-secret-generator:
            enabled: false
    - repoURL: https://github.com/activepieces/activepieces.git
      targetRevision: ${ACTIVEPIECES_CHART_SOURCE_REVISION}
      path: deploy/activepieces-helm
      helm:
        releaseName: activepieces-worker
        valuesObject:
          workloadType: statefulset
          podManagementPolicy: Parallel
          replicaCount: 4
          image:
            repository: ghcr.io/activepieces/activepieces
            tag: ${ACTIVEPIECES_IMAGE_TAG}
          serviceAccount:
            create: true
            automount: false
          persistence:
            enabled: false
          activepiecesConfig:
            AP_CONTAINER_TYPE: WORKER
            AP_DB_TYPE: POSTGRES
            AP_POSTGRES_DATABASE: activepieces
            AP_POSTGRES_HOST: ${ACTIVEPIECES_DATABASE_HOST}
            AP_POSTGRES_PORT: "5432"
            AP_POSTGRES_USERNAME: activepieces
            AP_POSTGRES_USE_SSL: "true"
            AP_POSTGRES_POOL_SIZE: "5"
            AP_REDIS_TYPE: SENTINEL
            AP_REDIS_SENTINEL_HOSTS: ${ACTIVEPIECES_REDIS_DATA_0_HOST}:26379,${ACTIVEPIECES_REDIS_DATA_1_HOST}:26379,${ACTIVEPIECES_REDIS_SENTINEL_2_HOST}:26379
            AP_REDIS_SENTINEL_NAME: activepieces
            AP_REDIS_SENTINEL_ROLE: master
            AP_REDIS_USE_SSL: "false"
            AP_FILE_STORAGE_LOCATION: S3
            AP_S3_BUCKET: ${ACTIVEPIECES_S3_BUCKET}
            AP_S3_ACCESS_KEY_ID: GK7d0a3e590650b4703e4d37d5
            AP_S3_ENDPOINT: http://${GARAGE_S3_IP}:${GARAGE_S3_PORT}
            AP_S3_REGION: ${GARAGE_S3_CUSTOM_REGION}
            AP_S3_USE_SIGNED_URLS: "false"
            AP_ENVIRONMENT: prod
            AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
            AP_FRONTEND_URL: https://${ACTIVEPIECES_HOST}
            AP_TELEMETRY_ENABLED: "false"
            AP_WORKER_CONCURRENCY: "1"
          activepiecesEnvVariables:
            activepieces-config:
              - AP_ENCRYPTION_KEY
              - AP_JWT_SECRET
              - AP_POSTGRES_PASSWORD
              - AP_REDIS_PASSWORD
              - AP_S3_SECRET_ACCESS_KEY
              - AP_WORKER_TOKEN
          ingress:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - ${TALOS_WORKER_LEFT}
                          - ${TALOS_WORKER_RIGHT}
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: activepieces
                        app.kubernetes.io/instance: activepieces-worker
                    topologyKey: kubernetes.io/hostname
          postgresql:
            enabled: false
          redis:
            enabled: false
          kubernetes-secret-generator:
            enabled: false
    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/activepieces
      plugin:
        name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: activepieces
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
