apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: activepieces-db
  namespace: activepieces
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:${POSTGRES_IMAGE_TAG}
  enableSuperuserAccess: false
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ${TALOS_WORKER_LEFT}
                  - ${TALOS_WORKER_RIGHT}
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    storageClass: openebs-local
    size: ${ACTIVEPIECES_DATABASE_STORAGE_SIZE}
  bootstrap:
    initdb:
      database: activepieces
      owner: activepieces
      secret:
        name: activepieces-config
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
