apiVersion: v1
kind: ServiceAccount
metadata:
  name: activepieces
  namespace: activepieces
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activepieces
  namespace: activepieces
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: activepieces
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activepieces
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: activepieces
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: activepieces
                  app.kubernetes.io/component: app
              topologyKey: kubernetes.io/hostname
      containers:
        - name: activepieces
          image: ghcr.io/activepieces/activepieces:${ACTIVEPIECES_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: activepieces-config
            - secretRef:
                name: activepieces-config
          env:
            - name: AP_CONTAINER_TYPE
              value: APP
            - name: AP_POSTGRES_POOL_SIZE
              value: "10"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activepieces-worker
  namespace: activepieces
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: activepieces
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activepieces
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: activepieces
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: activepieces
                    app.kubernetes.io/component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: activepieces-worker
          image: ghcr.io/activepieces/activepieces:${ACTIVEPIECES_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: activepieces-config
            - secretRef:
                name: activepieces-config
          env:
            - name: AP_CONTAINER_TYPE
              value: WORKER
            - name: AP_POSTGRES_POOL_SIZE
              value: "5"
            - name: AP_WORKER_CONCURRENCY
              value: "1"
            - name: AP_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: activepieces
  namespace: activepieces
spec:
  selector:
    app.kubernetes.io/name: activepieces
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: activepieces
  namespace: activepieces
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${ACTIVEPIECES_HOST}
      secretName: activepieces-tls
  rules:
    - host: ${ACTIVEPIECES_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: activepieces
                port:
                  name: http
