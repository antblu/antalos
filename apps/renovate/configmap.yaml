apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.js: |
    const { readFileSync } = require('node:fs');
    const { sign } = require('node:crypto');

    module.exports = async () => {
      const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
      const now = Math.floor(Date.now() / 1000);
      const payload = encode({ alg: 'RS256', typ: 'JWT' }) + '.' + encode({
        iat: now - 60,
        exp: now + 540,
        iss: process.env.GITHUB_APP_ID,
      });
      const signature = sign('RSA-SHA256', Buffer.from(payload),
        readFileSync('/var/run/renovate-app/private-key.pem')).toString('base64url');
      const response = await fetch(
        'https://api.github.com/app/installations/' + process.env.GITHUB_INSTALLATION_ID + '/access_tokens',
        {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + payload + '.' + signature,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'antblu-renovate',
          },
          signal: AbortSignal.timeout(30000),
        },
      );
      // Do not include request headers or response bodies in authentication errors.
      if (!response.ok) throw new Error('GitHub App token request failed: HTTP ' + response.status);
      const { token } = await response.json();
      if (!token) throw new Error('GitHub App token response contained no token');
      return {
        platform: 'github',
        token,
        autodiscover: true,
        onboarding: true,
        onboardingConfig: { extends: ['config:recommended'] },
        baseDir: '/tmp/renovate',
        cacheDir: '/tmp/renovate/cache',
        persistRepoData: false,
        repositoryCache: 'disabled',
        exitCodeForErrors: true,
      };
    };
