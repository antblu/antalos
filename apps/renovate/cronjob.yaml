apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "${RENOVATE_SCHEDULE}"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      parallelism: 1
      completions: 1
      backoffLimit: 1
      # Installation tokens expire after one hour; each new pod mints its own.
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: quorum
              operator: Exists
              effect: NoSchedule
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:${RENOVATE_IMAGE_TAG}
              env:
                - name: RENOVATE_CONFIG_FILE
                  value: /etc/renovate/config.js
                - name: GITHUB_APP_ID
                  value: "${RENOVATE_GITHUB_APP_ID}"
                - name: GITHUB_INSTALLATION_ID
                  value: "${RENOVATE_GITHUB_INSTALLATION_ID}"
                - name: LOG_LEVEL
                  value: info
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 10Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: config
                  mountPath: /etc/renovate
                  readOnly: true
                - name: github-app
                  mountPath: /var/run/renovate-app
                  readOnly: true
                - name: work
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: github-app
              secret:
                secretName: renovate-github-app
                defaultMode: 0440
            - name: work
              emptyDir:
                sizeLimit: 8Gi
