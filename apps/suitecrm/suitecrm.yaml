apiVersion: batch/v1
kind: Job
metadata:
  name: suitecrm-bootstrap
  namespace: suitecrm
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm-bootstrap
        app.kubernetes.io/part-of: suitecrm
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/pikapods/docker-suitecrm:${SUITECRM_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              deadline=$(( $(date +%s) + 900 ))
              until mysql --connect-timeout=5 \
                -h "$DB_HOST" \
                -P "$DB_PORT" \
                -u "$DB_USER" \
                --password="$DB_PASS" \
                "$DB_NAME" \
                -N -B -e "SELECT 1" >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "database and application user were not ready within 15 minutes" >&2
                  exit 1
                fi
                sleep 5
              done
              export PATH="/command:${PATH}"
              exec /etc/s6-overlay/scripts/20-suitecrm-bootstrap
          env:
            - name: APP_URL
              value: https://${SUITECRM_HOST}
            - name: DB_HOST
              value: ${SUITECRM_DATABASE_HOST}
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: suitecrm
            - name: DB_USER
              value: suitecrm
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: suitecrm-db-user
                  key: password
            - name: ADMIN_USER
              value: admin
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: suitecrm-app
                  key: admin-password
            - name: SITE_NAME
              value: SuiteCRM
            - name: TZ
              value: America/Denver
            - name: ENABLE_SUITECRM_CRON
              value: "FALSE"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suitecrm-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/part-of: suitecrm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm
        app.kubernetes.io/part-of: suitecrm
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: suitecrm
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: suitecrm
          image: ghcr.io/pikapods/docker-suitecrm:${SUITECRM_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_URL
              value: https://${SUITECRM_HOST}
            - name: DB_HOST
              value: ${SUITECRM_DATABASE_HOST}
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: suitecrm
            - name: DB_USER
              value: suitecrm
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: suitecrm-db-user
                  key: password
            - name: ADMIN_USER
              value: admin
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: suitecrm-app
                  key: admin-password
            - name: SITE_NAME
              value: SuiteCRM
            - name: TZ
              value: America/Denver
            - name: ENABLE_SUITECRM_CRON
              value: "FALSE"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /index.php?module=Users&action=Login
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /index.php?module=Users&action=Login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.php?module=Users&action=Login
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suitecrm-data
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: suitecrm
  namespace: suitecrm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: suitecrm-scheduler
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm-scheduler
    app.kubernetes.io/part-of: suitecrm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app.kubernetes.io/name: suitecrm-scheduler
            app.kubernetes.io/part-of: suitecrm
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - ${TALOS_WORKER_LEFT}
                          - ${TALOS_WORKER_RIGHT}
          securityContext:
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduler
              image: ghcr.io/pikapods/docker-suitecrm:${SUITECRM_IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
              args:
                - cd /var/www/html && php -f cron.php
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: suitecrm-data
---
apiVersion: v1
kind: Service
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: suitecrm
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: lax
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${SUITECRM_HOST}
      secretName: suitecrm-tls
  rules:
    - host: ${SUITECRM_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: suitecrm
                port:
                  name: http
