apiVersion: v1
kind: ConfigMap
metadata:
  name: suitecrm-env
  namespace: suitecrm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  APP_ENV: prod
  AUTH_TYPE: saml
  SAML_USERNAME_ATTRIBUTE: http://schemas.goauthentik.io/2021/02/saml/username
  SAML_USE_ATTRIBUTE_FRIENDLY_NAME: "false"
  SAML_AUTO_CREATE: enabled
  SAML_AUTOCREATE_ATTRIBUTES_MAP: "{}"
  SAML_IDP_ENTITY_ID: https://${AUTHENTIK_HOST}/application/saml/suitecrm/metadata/
  SAML_IDP_SSO_URL: https://${AUTHENTIK_HOST}/application/saml/suitecrm/
  SAML_IDP_SLO_URL: https://${AUTHENTIK_HOST}/application/saml/suitecrm/
  SAML_SP_ENTITY_ID: https://${SUITECRM_HOST}
  SAML_STRICT: "true"
  SAML_DEBUG: "false"
  SAML_AUTHN_REQUESTS_SIGNED: "false"
  SAML_LOGOUT_REQUEST_SIGNED: "false"
  SAML_LOGOUT_RESPONSE_SIGNED: "false"
  SAML_WANT_MESSAGES_SIGNED: "false"
  SAML_WANT_ASSERTIONS_SIGNED: "true"
  SAML_WANT_ASSERTIONS_ENCRYPTED: "false"
  SAML_WANT_NAME_ID: "false"
  SAML_REQUESTED_AUTHN_CONTEXT: "false"
  TZ: America/Denver
---
apiVersion: batch/v1
kind: Job
metadata:
  name: suitecrm-bootstrap
  namespace: suitecrm
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm-bootstrap
        app.kubernetes.io/part-of: suitecrm
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: suitecrm-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ${SUITECRM_IMAGE_REPOSITORY}:${SUITECRM_IMAGE_TAG}@${SUITECRM_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              deadline=$(( $(date +%s) + 900 ))
              until php -r '
                try {
                  new PDO(
                    "mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_NAME"),
                    getenv("DB_USER"),
                    getenv("DB_PASS"),
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
                  );
                } catch (Throwable $error) {
                  exit(1);
                }
              ' >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "database and application user were not ready within 15 minutes" >&2
                  exit 1
                fi
                sleep 5
              done

              app_root=/mnt/suitecrm-data/suitecrm8
              mkdir -p "$app_root"
              if [ ! -f "$app_root/.suitecrm-code-$SUITECRM_VERSION" ]; then
                cp -a /var/www/html/. "$app_root/"
                touch "$app_root/.suitecrm-code-$SUITECRM_VERSION"
              fi

              mkdir -p "$app_root/var/sessions" /var/www/html/var/sessions
              cd "$app_root"

              if [ ! -f public/legacy/config.php ]; then
                php -d session.save_path="$app_root/var/sessions" bin/console suitecrm:app:install \
                  -u "$ADMIN_USER" \
                  -p "$ADMIN_PASS" \
                  -U "$DB_USER" \
                  -P "$DB_PASS" \
                  -H "$DB_HOST" \
                  -Z "$DB_PORT" \
                  -N "$DB_NAME" \
                  -S "$APP_URL" \
                  -d no \
                  -W true
              fi

              if ! grep -q "/var/www/html/var/sessions" public/legacy/config_override.php 2>/dev/null; then
                printf "\n\$sugar_config['session_dir'] = '/var/www/html/var/sessions';\n" >> public/legacy/config_override.php
              fi

              php -d session.save_path="$app_root/var/sessions" bin/console messenger:setup-transports
              php -d session.save_path="$app_root/var/sessions" bin/console cache:clear
          envFrom:
            - configMapRef:
                name: suitecrm-env
          env:
            - name: SUITECRM_VERSION
              value: ${SUITECRM_IMAGE_TAG}
            - name: APP_URL
              value: https://${SUITECRM_HOST}
            - name: DB_HOST
              value: ${SUITECRM_DATABASE_HOST}
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: suitecrm
            - name: DB_USER
              value: suitecrm
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: suitecrm-db-user
                  key: password
            - name: ADMIN_USER
              value: admin
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: suitecrm-app
                  key: admin-password
            - name: SAML_IDP_X509CERT
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: idp-cert
            - name: SAML_SP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: sp-private-key
            - name: SAML_SP_CERT
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: sp-cert
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /mnt/suitecrm-data
            # Cache must not live on the shared NFS volume: cache:clear races
            # with live replicas when Argo CD reruns this hook.
            - name: cache
              mountPath: /mnt/suitecrm-data/suitecrm8/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suitecrm-data
        - name: cache
          emptyDir:
            medium: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/part-of: suitecrm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm
        app.kubernetes.io/part-of: suitecrm
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: suitecrm-registry
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: suitecrm
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: suitecrm
          image: ${SUITECRM_IMAGE_REPOSITORY}:${SUITECRM_IMAGE_TAG}@${SUITECRM_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: suitecrm-env
          env:
            - name: SAML_IDP_X509CERT
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: idp-cert
            - name: SAML_SP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: sp-private-key
            - name: SAML_SP_CERT
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: sp-cert
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /auth
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /auth
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/html
              subPath: suitecrm8
            # Keep each replica's generated Symfony cache isolated and local.
            - name: cache
              mountPath: /var/www/html/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suitecrm-data
        - name: cache
          emptyDir:
            medium: ""
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: suitecrm
  namespace: suitecrm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: suitecrm-scheduler
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm-scheduler
    app.kubernetes.io/part-of: suitecrm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app.kubernetes.io/name: suitecrm-scheduler
            app.kubernetes.io/part-of: suitecrm
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: suitecrm-registry
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - ${TALOS_WORKER_LEFT}
                          - ${TALOS_WORKER_RIGHT}
          securityContext:
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduler
              image: ${SUITECRM_IMAGE_REPOSITORY}:${SUITECRM_IMAGE_TAG}@${SUITECRM_IMAGE_DIGEST}
              imagePullPolicy: IfNotPresent
              command:
                - php
                - bin/console
                - schedulers:run
              envFrom:
                - configMapRef:
                    name: suitecrm-env
              env:
                - name: SAML_IDP_X509CERT
                  valueFrom:
                    secretKeyRef:
                      name: suitecrm-saml
                      key: idp-cert
                - name: SAML_SP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: suitecrm-saml
                      key: sp-private-key
                - name: SAML_SP_CERT
                  valueFrom:
                    secretKeyRef:
                      name: suitecrm-saml
                      key: sp-cert
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
                  subPath: suitecrm8
                - name: cache
                  mountPath: /var/www/html/cache
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: suitecrm-data
            - name: cache
              emptyDir:
                medium: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm-messenger
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm-messenger
    app.kubernetes.io/part-of: suitecrm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm-messenger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm-messenger
        app.kubernetes.io/part-of: suitecrm
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: suitecrm-registry
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: messenger
          image: ${SUITECRM_IMAGE_REPOSITORY}:${SUITECRM_IMAGE_TAG}@${SUITECRM_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          command:
            - php
            - bin/console
            - messenger:consume
            - internal-async
            - --time-limit=3600
            - --memory-limit=256M
          envFrom:
            - configMapRef:
                name: suitecrm-env
          env:
            - name: SAML_IDP_X509CERT
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: idp-cert
            - name: SAML_SP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: sp-private-key
            - name: SAML_SP_CERT
              valueFrom:
                secretKeyRef:
                  name: suitecrm-saml
                  key: sp-cert
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - kill -0 1
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - kill -0 1
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html
              subPath: suitecrm8
            - name: cache
              mountPath: /var/www/html/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suitecrm-data
        - name: cache
          emptyDir:
            medium: ""
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: suitecrm-messenger
  namespace: suitecrm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm-messenger
---
apiVersion: v1
kind: Service
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: suitecrm
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: lax
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${SUITECRM_HOST}
      secretName: suitecrm-tls
  rules:
    - host: ${SUITECRM_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: suitecrm
                port:
                  name: http
