apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: victorialogs-root-redirect
  namespace: monitoring
spec:
  redirectRegex:
    regex: ^https?://[^/]+/?$
    replacement: https://${VICTORIALOGS_HOST}/select/vmui/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`${VICTORIALOGS_HOST}`) && Path(`/`)
      priority: 20
      middlewares:
        - name: victorialogs-root-redirect
      services:
        - kind: Service
          name: vlselect-victoriametrics-vmks
          port: 9471
    - kind: Rule
      match: Host(`${VICTORIALOGS_HOST}`) && PathPrefix(`/select`)
      priority: 10
      middlewares:
        - name: authentik-forward-auth
          namespace: traefik
      services:
        - kind: Service
          name: vlselect-victoriametrics-vmks
          port: 9471
  tls:
    secretName: victorialogs-tls
