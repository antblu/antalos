          "title": "Open WebUI OTLP",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 9},
          "id": 16,
          "options": {"cellHeight": "sm", "footer": {"show": false}, "showHeader": true},
          "targets": [{"expr": "min by (namespace, job, pod, service) (up{namespace=~\"argocd|authentik|cert-manager|cnpg-system|gitlab|litellm|mariadb-system|metallb-system|metrics-server|nextcloud|cattle-fleet-system|sealed-secrets|stalwart\"})", "format": "table", "instant": true, "legendFormat": "{{namespace}} / {{job}}", "refId": "A"}],
          "title": "Scrape targets",
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true}, "renameByName": {"Value": "UP"}}}],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 17},
          "id": 17,
          "panels": [],
          "title": "Ingestion and workload signals",
          "type": "row"
        },
