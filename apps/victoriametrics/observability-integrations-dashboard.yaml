          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 18},
          "id": 18,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (namespace) (scrape_samples_scraped{namespace=~\"argocd|authentik|cert-manager|cnpg-system|gitlab|litellm|mariadb-system|metallb-system|metrics-server|nextcloud|cattle-fleet-system|sealed-secrets|stalwart\"})", "legendFormat": "{{namespace}}", "refId": "A"}],
          "title": "Samples collected per scrape",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 18},
          "id": 19,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
