          "title": "Container CPU by namespace",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 26},
          "id": 20,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"argocd|authentik|cert-manager|cnpg-system|gitlab|litellm|mariadb-system|metallb-system|metrics-server|nextcloud|open-webui|cattle-fleet-system|sealed-secrets|stalwart\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{namespace}}", "refId": "A"}],
          "title": "Container memory by namespace",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 26},
          "id": 21,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"argocd|authentik|cert-manager|cnpg-system|gitlab|litellm|mariadb-system|metallb-system|metrics-server|nextcloud|open-webui|cattle-fleet-system|sealed-secrets|stalwart\"}[$__range]))", "legendFormat": "{{namespace}} / {{pod}}", "refId": "A"}],
          "title": "Container restarts in selected range",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 34},
          "id": 22,
          "panels": [],
          "title": "VictoriaLogs",
          "type": "row"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 35},
          "id": 23,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"datasource": {"type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs"}, "expr": "kubernetes.pod_namespace:=\"$namespace\"", "queryType": "range", "refId": "A"}],
          "title": "$namespace logs",
          "type": "logs"
        }
