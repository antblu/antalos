      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["victoriametrics", "victorialogs", "observability", "cluster-services"],
      "templating": {
        "list": [
          {
            "current": {"selected": true, "text": "argocd", "value": "argocd"},
            "hide": 0,
            "includeAll": false,
            "label": "Log namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": "argocd,authentik,cert-manager,cnpg-system,gitlab,litellm,mariadb-system,metallb-system,metrics-server,nextcloud,open-webui,cattle-fleet-system,sealed-secrets,stalwart",
            "skipUrlSync": false,
            "type": "custom"
          }
        ]
