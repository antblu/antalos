apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-headscale
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  headscale.json: |-
    {
      "annotations": {"list": []},
      "description": "Headscale control-plane health, node-store activity, Kubernetes resources, and VictoriaLogs.",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"cellHeight": "sm", "footer": {"show": false}, "showHeader": true},
          "targets": [{"expr": "kube_pod_status_ready{namespace=\"headscale\",pod=~\"headscale-[0-9]+\",condition=\"true\"}", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Headscale replica status",
          "type": "table"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "max(headscale_nodestore_nodes)", "refId": "A"}],
          "title": "Registered nodes",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(rate(headscale_nodestore_batch_size_count[$__rate_interval]))", "refId": "A"}],
          "title": "Node-store batches/sec",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(headscale_nodestore_snapshot_build_duration_seconds_bucket[$__rate_interval])))", "refId": "A"}],
          "title": "Node snapshot p95",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 5},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (method, code) (rate(http_requests_total{namespace=\"headscale\"}[$__rate_interval]))", "legendFormat": "{{method}} {{code}}", "refId": "A"}],
          "title": "HTTP request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 5},
          "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(headscale_nodestore_peers_calculation_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p95", "refId": "A"}, {"expr": "rate(headscale_nodestore_peers_calculation_duration_seconds_sum[$__rate_interval]) / clamp_min(rate(headscale_nodestore_peers_calculation_duration_seconds_count[$__rate_interval]), 1)", "legendFormat": "mean", "refId": "B"}],
          "title": "Peer calculation duration",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"headscale\",container!=\"POD\",container!=\"\"}[$__rate_interval]))", "legendFormat": "{{pod}} / {{container}}", "refId": "A"}],
          "title": "Container CPU",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "id": 8,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"headscale\",container!=\"POD\",container!=\"\"})", "legendFormat": "{{pod}} / {{container}}", "refId": "A"}],
          "title": "Container memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 22},
          "id": 9,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"datasource": {"type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs"}, "expr": "kubernetes.pod_namespace:=\"headscale\"", "queryType": "range", "refId": "A"}],
          "title": "Headscale logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["headscale", "victoriametrics", "victorialogs"],
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Headscale",
      "uid": "headscale-victoriametrics",
      "version": 1
    }
