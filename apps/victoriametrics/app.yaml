apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoriametrics
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: ${VICTORIAMETRICS_CHART_VERSION}
      helm:
        # The parent app-of-apps plugin substitutes shared variables here before Helm runs.
        valuesObject:
          nameOverride: vmks

          prometheus-node-exporter:
            namespaceOverride: node-exporter
            vmScrape:
              spec:
                namespaceSelector:
                  matchNames:
                    - node-exporter

          victoria-metrics-operator:
            replicaCount: 1
            admissionWebhooks:
              certManager:
                enabled: true

          vmsingle:
            enabled: false

          vmcluster:
            enabled: true
            spec:
              retentionPeriod: 30d
              replicationFactor: 2

              vmstorage:
                replicaCount: 2
                extraArgs:
                  dedup.minScrapeInterval: 30s
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: vmstorage
                        topologyKey: kubernetes.io/hostname
                storageDataPath: /vm-data
                storage:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      storageClassName: openebs-local
                      resources:
                        requests:
                          storage: 50Gi

              vmselect:
                replicaCount: 2
                extraArgs:
                  dedup.minScrapeInterval: 30s
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: vmselect
                        topologyKey: kubernetes.io/hostname
                cacheMountPath: /select-cache
                storage:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      storageClassName: openebs-local
                      resources:
                        requests:
                          storage: 5Gi

              vminsert:
                replicaCount: 2
                updateStrategy: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: vminsert
                        topologyKey: kubernetes.io/hostname

          # Two agents scrape the same targets for ingestion HA. The VMCluster
          # deduplication interval above matches this scrape interval.
          vmagent:
            enabled: true
            spec:
              replicaCount: 2
              scrapeInterval: 30s
              externalLabelName: vmagent_ha
              statefulMode: true
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: vmagent
                      topologyKey: kubernetes.io/hostname
              statefulStorage:
                volumeClaimTemplate:
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    storageClassName: openebs-local
                    resources:
                      requests:
                        storage: 5Gi

          vlsingle:
            enabled: false

          vlcluster:
            enabled: true
            spec:
              vlinsert:
                replicaCount: 2
                updateStrategy: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: vlinsert
                        topologyKey: kubernetes.io/hostname

              vlselect:
                replicaCount: 2
                updateStrategy: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: vlselect
                        topologyKey: kubernetes.io/hostname

              vlstorage:
                replicaCount: 2
                retentionPeriod: 14d
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: vlstorage
                        topologyKey: kubernetes.io/hostname
                storageDataPath: /vl-data
                storage:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      storageClassName: openebs-local
                      resources:
                        requests:
                          storage: 25Gi

          vlagent:
            enabled: true
            namespaceOverride: log-agent
            spec:
              k8sCollector:
                enabled: true

          grafana:
            enabled: true
            fullnameOverride: grafana
            replicas: 1
            nodeSelector:
              kubernetes.io/hostname: ${TALOS_WORKER_RIGHT}
            plugins:
              - victoriametrics-logs-datasource
            persistence:
              enabled: true
              type: pvc
              storageClassName: openebs-local
              accessModes:
                - ReadWriteOnce
              size: 5Gi
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - ${GRAFANA_HOST}
              tls:
                - secretName: grafana-tls
                  hosts:
                    - ${GRAFANA_HOST}

          defaultDashboards:
            enabled: true
            annotations:
              argocd.argoproj.io/sync-options: ServerSideApply=true

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/victoriametrics
      plugin:
        name: yaml-envsubst

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Argo CD cannot retain Helm-generated Grafana passwords across renders.
  ignoreDifferences:
    - group: ''
      kind: Secret
      name: grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
