apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.0
      helm:
        values: |
          authentik:
            existingSecret:
              secretName: authentik-secrets
            error_reporting:
              enabled: false
            postgresql:
              host: authentik-db-rw.authentik.svc.cluster.local
              name: authentik
              user: authentik

          server:
            replicas: 2

            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - auth.antblu.net
              tls:
                - hosts:
                    - auth.antblu.net
                  secretName: authentik-tls

          postgresql:
            enabled: false

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/authentik
      directory:
        include: '*.yaml'
        exclude: 'app.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true