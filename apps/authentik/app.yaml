apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: ${AUTHENTIK_CHART_VERSION}
      helm:
        values: |
          global:
            affinity:
              podAntiAffinity: hard
            volumeMounts:
              - name: access-control
                mountPath: /access-control
                readOnly: true
              - name: media
                mountPath: /data
              - name: cal-diy-blueprint
                mountPath: /blueprints/cal-diy.yaml
                subPath: cal-diy.yaml
                readOnly: true
            volumes:
              - name: access-control
                configMap:
                  name: authentik-access-control
              - name: media
                persistentVolumeClaim:
                  claimName: authentik-media
              - name: cal-diy-blueprint
                configMap:
                  name: authentik-cal-diy-blueprint
            env:
              - name: VAULTWARDEN_AUTH_HOST
                value: ${VAULTWARDEN_HOST}
              - name: STALWART_AUTH_GROUP_DOMAIN
                value: ${MAIL_DOMAIN}
              - name: AUTHENTIK_POSTGRESQL__HOST
                value: authentik-db-rw.authentik.svc.cluster.local
              - name: AUTHENTIK_POSTGRESQL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-db-app
                    key: password
              - name: AUTHENTIK_EMAIL__HOST
                value: "${AUTHENTIK_EMAIL_HOST}"
              - name: AUTHENTIK_EMAIL__PORT
                value: "${AUTHENTIK_EMAIL_PORT}"
              - name: AUTHENTIK_EMAIL__USERNAME
                value: "${AUTHENTIK_EMAIL_USERNAME}"
              - name: AUTHENTIK_EMAIL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-email
                    key: password
              - name: AUTHENTIK_EMAIL__USE_TLS
                value: "${AUTHENTIK_EMAIL_USE_TLS}"
              - name: AUTHENTIK_EMAIL__USE_SSL
                value: "${AUTHENTIK_EMAIL_USE_SSL}"
              - name: AUTHENTIK_EMAIL__FROM
                value: "${AUTHENTIK_EMAIL_FROM}"
              # Increment when authentik-email changes so pods reload secret-backed env.
              - name: EMAIL_SECRET_REVISION
                value: "${AUTHENTIK_EMAIL_SECRET_REVISION}"
              - name: CALDIY_OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: authentik-cal-diy-oidc
                    key: client-secret
              - name: CALDIY_OIDC_REVISION
                value: "${AUTHENTIK_CALDIY_OIDC_REVISION}"

          authentik:
            existingSecret:
              secretName: authentik-secrets

          server:
            replicas: 2
            deploymentStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1

            metrics:
              enabled: true
              service:
                labels:
                  metrics.antblu.net/scrape: authentik-server

            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
              hosts:
                - ${AUTHENTIK_HOST}
              tls:
                - hosts:
                    - ${AUTHENTIK_HOST}
                  secretName: authentik-tls

          worker:
            replicas: 2
            # Reconcile from the new worker image rather than waiting for the
            # upstream four-hour schedule or queueing work on an older worker.
            lifecycle:
              postStart:
                exec:
                  command:
                    - ak
                    - shell
                    - -c
                    - |
                      exec(compile(open('/access-control/reconcile.py').read(), '/access-control/reconcile.py', 'exec'))

                      from authentik.outposts.models import Outpost, OutpostType
                      from authentik.outposts.tasks import controller_for_outpost

                      for outpost in Outpost.objects.filter(type=OutpostType.LDAP, service_connection__isnull=False):
                          controller_type = controller_for_outpost(outpost)
                          if controller_type is None:
                              raise RuntimeError(f"No controller for {outpost.name}")
                          with controller_type(outpost, outpost.service_connection) as controller:
                              for entry in controller.up_with_logs():
                                  entry.log()
            deploymentStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            metrics:
              enabled: true
              service:
                labels:
                  metrics.antblu.net/scrape: authentik-worker

          postgresql:
            enabled: false

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/authentik
      plugin:
        name: yaml-envsubst

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
