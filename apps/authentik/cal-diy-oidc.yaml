apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-cal-diy-oidc
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: authentik-cal-diy-oidc
      namespace: authentik
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-cal-diy-blueprint
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  cal-diy.yaml: |
    version: 1
    metadata:
      name: Antalos - Cal.diy OIDC
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: cal-diy-provider
        identifiers:
          name: Provider for Cal.diy
        attrs:
          authentication_flow: !Find
            - authentik_flows.flow
            - - slug
              - normal-authentication-flow
          authorization_flow: !Find
            - authentik_flows.flow
            - - slug
              - default-provider-authorization-implicit-consent
          invalidation_flow: !Find
            - authentik_flows.flow
            - - slug
              - default-provider-invalidation-flow
          client_type: confidential
          client_id: ${CALDIY_OIDC_CLIENT_ID}
          client_secret: !Env CALDIY_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          issuer_mode: per_provider
          property_mappings:
            - !Find
              - authentik_providers_oauth2.scopemapping
              - - scope_name
                - openid
            - !Find
              - authentik_providers_oauth2.scopemapping
              - - scope_name
                - email
            - !Find
              - authentik_providers_oauth2.scopemapping
              - - scope_name
                - profile
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://${CALDIY_HOST}/api/auth/callback/oidc
          signing_key: !Find
            - authentik_crypto.certificatekeypair
            - - name
              - authentik Self-signed Certificate
          sub_mode: hashed_user_id
      - model: authentik_core.application
        state: present
        identifiers:
          slug: cal-diy
        attrs:
          name: Cal.diy
          provider: !KeyOf cal-diy-provider
          meta_description: Self-hosted scheduling
          meta_launch_url: https://${CALDIY_HOST}
          policy_engine_mode: any
