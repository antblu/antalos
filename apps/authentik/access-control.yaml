# Generated by access-control/render-configmap.py. Edit access-control/reconcile.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-access-control
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
data:
  reconcile.py: |
    """Idempotent application authorization migration; execute with ak shell.

    Uses the same Django management-shell mechanism as existing provider automation.
    Never logs credentials or replaces unrelated bindings, memberships or mappings.
    """
    import os

    from django.db import transaction
    from django.db.models import Q
    from authentik.core.models import Application, Group, User
    from authentik.policies.models import PolicyBinding
    from authentik.providers.oauth2.models import (
        OAuth2Provider, RedirectURI, RedirectURIMatchingMode, ScopeMapping,
    )
    from authentik.providers.saml.models import SAMLProvider, SAMLPropertyMapping
    from authentik.providers.proxy.models import ProxyProvider
    from authentik.outposts.models import Outpost

    # Keep legacy names as compatibility groups: downstream consumers may use them.
    LEGACY = {
        'argo-cd': {'users': ['Argo CD Viewers'], 'admins': ['Argo CD Admins']},
        'grafana': {'admins': ['Grafana Admins']},
        'jellyfin': {'users': ['Jellyfin Users'], 'admins': ['Jellyfin Admins']},
        'home-assitant': {'users': ['HA Users', 'home-assitant-users'], 'admins': ['HA Admins', 'home-assitant-admins']},
        'obsidian-live-sync': {'admins': ['Obsidian Admin']},
        'odoo': {'users': ['Odoo Users']},
        'mautic': {'users': ['Mautic Users']},
    }
    GLOBAL_ADMINS = 'antalos-admins'
    GLOBAL_USERS = 'antalos-users'
    ORG_ADMINS = ('mautic', 'medusa', 'zammad', 'odoo')
    # This application is a public status-page bookmark, with a separate admin app.
    PUBLIC = {'uptime-kuma'}
    GROUP_PREFIX = {'vaultwarden-admin': 'vaultwarden', 'home-assitant': 'home-assistant'}
    # These integrations expose only a privileged surface. Ordinary membership must
    # never imply admin privileges. Medusa customers use the separate customer flow.
    ADMIN_ONLY = {'medusa', 'uptime-kuma-admin', 'traefik', 'obsidian-live-sync', 'homelable', 'ur-backup', 'vaultwarden-admin'}


    def ensure_argocd_callback(provider, host):
        """Prepare native OIDC without disrupting the existing Dex integration."""
        if not host:
            return
        callback = RedirectURI(
            matching_mode=RedirectURIMatchingMode.STRICT,
            url=f"https://{host}/auth/callback",
        )
        if callback not in provider.redirect_uris:
            provider.redirect_uris = [*provider.redirect_uris, callback]
            provider.save(update_fields=['redirect_uris'])


    def reconcile():
        with transaction.atomic():
            # Serialize workers during a rolling restart.
            from django.db import connection
            with connection.cursor() as cursor:
                cursor.execute('SELECT pg_advisory_xact_lock(1740932741)')
            if os.environ.get('VAULTWARDEN_AUTH_HOST'):
                # Preserve the existing native OIDC provider. The separate proxy
                # protects only the server-administration surface on the same host.
                reference = Application.objects.get(slug='traefik').get_provider()
                proxy, _ = ProxyProvider.objects.get_or_create(
                    name='Vaultwarden administration',
                    defaults={'authorization_flow': reference.authorization_flow,
                              'invalidation_flow': reference.invalidation_flow,
                              'authentication_flow': reference.authentication_flow,
                              'mode': 'forward_single',
                              'external_host': 'https://' + os.environ['VAULTWARDEN_AUTH_HOST']})
                if proxy.mode != 'forward_single' or proxy.external_host != 'https://' + os.environ['VAULTWARDEN_AUTH_HOST']:
                    raise RuntimeError('Review incompatible Vaultwarden administration provider')
                Application.objects.update_or_create(
                    slug='vaultwarden-admin',
                    defaults={'name': 'Vaultwarden administration', 'provider': proxy,
                              'meta_launch_url': 'https://' + os.environ['VAULTWARDEN_AUTH_HOST'] + '/admin',
                              'policy_engine_mode': 'any'})
                Outpost.objects.get(name='authentik Embedded Outpost').providers.add(proxy)
            global_users, _ = Group.objects.get_or_create(name=GLOBAL_USERS)
            global_admins, _ = Group.objects.update_or_create(
                name=GLOBAL_ADMINS, defaults={'is_superuser': True})
            global_admins.parents.add(global_users)
            global_admins.users.add(User.objects.get(username='antblu', is_active=True))
            # Preserve existing operators through the new umbrella role. The reverse
            # relationship would incorrectly make application admins superusers.
            operators = Group.objects.get(name='authentik Admins')
            operators.parents.add(global_admins)
            organization, _ = Group.objects.get_or_create(name='emiliany-admin')
            people = [User.objects.get(username=name, is_active=True)
                      for name in ('estefania.cc', 'emiliany-admin')]
            applications = list(Application.objects.all())
            required = set(ORG_ADMINS) | {'stalwart'}
            if not required.issubset({app.slug for app in applications}):
                raise RuntimeError('Required Emiliany application is missing')
            groups = {}
            for app in applications:
                if PolicyBinding.objects.filter(target=app).filter(
                    Q(policy__isnull=False)
                    | Q(negate=True)
                ).exists():
                    raise RuntimeError(f'Review non-group authorization before migrating {app.slug}')
                prefix = GROUP_PREFIX.get(app.slug, app.slug)
                users, _ = Group.objects.get_or_create(name=f'{prefix}-users')
                admins, _ = Group.objects.get_or_create(name=f'{prefix}-admins')
                # Authentik User.all_groups() uses with_ancestors().
                admins.parents.add(users)
                groups[app.slug] = (users, admins)
                global_users.parents.add(users)
                global_admins.parents.add(admins)
                for kind, aliases in LEGACY.get(app.slug, {}).items():
                    parent = admins if kind == 'admins' else users
                    for name in aliases:
                        legacy = Group.objects.filter(name=name).first()
                        if legacy:
                            legacy.parents.add(parent)
                # Preserve existing explicit access through equivalent effective
                # membership. Existing policy/user bindings remain untouched.
                for binding in PolicyBinding.objects.filter(target=app, enabled=True, negate=False):
                    if binding.group_id:
                        legacy = binding.group
                        if legacy not in (users, admins):
                            legacy.parents.add(admins if app.slug in ADMIN_ONLY else users)
                    elif binding.user_id:
                        (admins if app.slug in ADMIN_ONLY else users).users.add(binding.user)
                if app.slug not in PUBLIC:
                    allowed = admins if app.slug in ADMIN_ONLY else users
                    if app.slug in ADMIN_ONLY:
                        # Retire only the ordinary gate created by this reconciler
                        # before the integration was identified as an admin surface.
                        PolicyBinding.objects.filter(target=app, group=users, order=100).update(enabled=False)
                    PolicyBinding.objects.get_or_create(
                        target=app, group=allowed,
                        defaults={'order': 100, 'enabled': True},
                    )
                    # Preserve operator access previously provided by unbound apps.
                    # These direct edges were owned by the previous reconciler;
                    # access now follows the global umbrella group instead.
                    operators.parents.remove(admins)
                provider = app.get_provider() if app.provider_id else None
                if isinstance(provider, OAuth2Provider):
                    if app.slug == 'argo-cd':
                        ensure_argocd_callback(provider, os.environ.get('ARGOCD_AUTH_HOST'))
                    # Replace only this provider's profile mapping, retaining name,
                    # avatar, email and all other existing scopes. Effective groups
                    # are essential: the upstream default emits direct groups only.
                    original = ScopeMapping.objects.get(
                        name="authentik default OAuth Mapping: OpenID 'profile'")
                    expression = original.expression.replace(
                        'request.user.groups.all()', 'request.user.all_groups()')
                    if app.slug in LEGACY:
                        aliases = {f'{prefix}-{kind}': list(names) for kind, names in LEGACY[app.slug].items()}
                        if app.slug == 'home-assitant':
                            aliases[f'{prefix}-admins'] += ['admins']
                            aliases[f'{prefix}-users'] += ['users']
                        # Preserve native consumers which still match legacy claim
                        # names, while directory authorization uses standard groups.
                        expression = expression.replace(
                            '[group.name for group in request.user.all_groups()]',
                            'sorted(set(request.user.all_groups().values_list("name", flat=True)) | '
                            '{alias for canonical, aliases in '+repr(aliases)+'.items() '
                            'if request.user.all_groups().filter(name=canonical).exists() for alias in aliases})')
                    mapping, _ = ScopeMapping.objects.update_or_create(
                        name=f'antalos {app.slug}: effective profile',
                        defaults={'scope_name': 'profile', 'expression': expression},
                    )
                    # Several independent mappings intentionally share profile.
                    # Never consume the role or application-specific mappings on a
                    # subsequent reconciliation, or identity/group claims disappear.
                    provider.property_mappings.remove(original)
                    provider.property_mappings.add(mapping)
                    roles, _ = ScopeMapping.objects.update_or_create(
                        name=f'antalos {app.slug}: application roles',
                        defaults={'scope_name': 'profile', 'expression': (
                            f'admin = request.user.all_groups().filter(name={admins.name!r}).exists()\n'
                            'return {"application_role": "admin" if admin else "user"}'
                        )},
                    )
                    provider.property_mappings.add(roles)
                    if app.slug in ('nextcloud', 'immich'):
                        native_expression = (
                            "admin = request.user.all_groups().filter(name='nextcloud-admins').exists()\n"
                            'return {"nextcloud_groups": ["nextcloud-users"] + (["admin"] if admin else [])}'
                            if app.slug == 'nextcloud' else
                            "admin = request.user.all_groups().filter(name='immich-admins').exists()\n"
                            'return {"immich_role": "admin" if admin else "user"}'
                        )
                        native, _ = ScopeMapping.objects.update_or_create(
                            name=f'antalos {app.slug}: native authorization',
                            defaults={'scope_name': 'profile', 'expression': native_expression},
                        )
                        provider.property_mappings.add(native)
                    if app.slug == 'headscale':
                        headplane, _ = ScopeMapping.objects.update_or_create(
                            name='antalos headscale: Headplane role',
                            defaults={'scope_name': 'profile', 'expression': (
                                "admin = request.user.all_groups().filter(name='headscale-admins').exists()\n"
                                'return {"headplane_role": "admin" if admin else "viewer"}'
                            )},
                        )
                        provider.property_mappings.add(headplane)
                    if app.slug == 'stalwart':
                        domain = os.environ['STALWART_AUTH_GROUP_DOMAIN']
                        mail_groups, _ = ScopeMapping.objects.update_or_create(
                            name='antalos stalwart: mail groups',
                            defaults={'scope_name': 'profile', 'expression': (
                                'return {"stalwart_groups": [group.name + '
                                f'{("@" + domain)!r} for group in request.user.all_groups() '
                                'if group.name in ("stalwart-users", "stalwart-admins")]}'
                            )},
                        )
                        provider.property_mappings.add(mail_groups)
                    if not provider.include_claims_in_id_token:
                        provider.include_claims_in_id_token = True
                        provider.save(update_fields=['include_claims_in_id_token'])
                elif isinstance(provider, SAMLProvider):
                    mapping, _ = SAMLPropertyMapping.objects.update_or_create(
                        name=f'antalos {app.slug}: effective groups',
                        defaults={'saml_name': 'http://schemas.xmlsoap.org/claims/Group',
                                  'expression': 'return list(request.user.all_groups().values_list("name", flat=True))'},
                    )
                    provider.property_mappings.add(mapping)
            for slug in ORG_ADMINS:
                organization.parents.add(groups[slug][1])
            organization.parents.add(groups['stalwart'][0])
            organization.users.add(*people)
            # Preserve the existing LDAP client's ability to bind/search; this is an
            # application service account, not a user-facing application of its own.
            ldap_client = User.objects.filter(username='jellyfin-ldap', type='service_account').first()
            if ldap_client and 'jellyfin' in groups:
                groups['jellyfin'][0].users.add(ldap_client)
            forbidden = groups['stalwart'][1]
            for person in people:
                effective = set(person.all_groups().values_list('name', flat=True))
                expected = {f'{slug}-admins' for slug in ORG_ADMINS} | {
                    f'{slug}-users' for slug in ORG_ADMINS} | {'stalwart-users'}
                if not expected.issubset(effective) or forbidden.name in effective:
                    raise RuntimeError('Emiliany effective membership violates the access contract')
            print(f'Reconciled group structure for {len(applications)} applications; Emiliany membership verified.')


    reconcile()
