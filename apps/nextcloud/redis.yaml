apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-redis-config
  namespace: nextcloud
data:
  start-redis.sh: |
    #!/bin/sh
    set -eu
    # Redis must have a writable config: Sentinel persists role changes with CONFIG REWRITE.
    if [ ! -s /data/redis.conf ]; then
      umask 077
      cat > /data/redis.conf <<REDIS
    appendonly yes
    appendfsync everysec
    requirepass "$REDIS_PASSWORD"
    masterauth "$REDIS_PASSWORD"
    protected-mode no
    dir /data
    REDIS
      if [ "$HOSTNAME" = nextcloud-redis-data-1 ]; then
        echo 'replicaof nextcloud-redis-data-0.nextcloud-redis-data.nextcloud.svc.cluster.local 6379' >> /data/redis.conf
      fi
    fi
    # A returning former primary must follow the current Sentinel quorum.
    export REDISCLI_AUTH="$REDIS_PASSWORD"
    self="$HOSTNAME.nextcloud-redis-data.nextcloud.svc.cluster.local"
    while :; do
      votes=""
      for sentinel in nextcloud-redis-data-0.nextcloud-redis-data.nextcloud.svc.cluster.local nextcloud-redis-data-1.nextcloud-redis-data.nextcloud.svc.cluster.local nextcloud-redis-sentinel-2.nextcloud.svc.cluster.local; do
        answer=$(timeout 3 redis-cli --raw -h "$sentinel" -p 26379 SENTINEL get-master-addr-by-name nextcloud 2>/dev/null) || continue
        target=$(printf '%s\n' "$answer" | sed -n '1p')
        port=$(printf '%s\n' "$answer" | sed -n '2p')
        [ "$port" = 6379 ] || continue
        for candidate in nextcloud-redis-data-0.nextcloud-redis-data.nextcloud.svc.cluster.local nextcloud-redis-data-1.nextcloud-redis-data.nextcloud.svc.cluster.local; do
          if [ "$target" = "$candidate" ] || getent ahostsv4 "$candidate" | awk -v address="$target" '$1==address {found=1} END {exit !found}'; then
            votes="$votes
    $candidate"
            break
          fi
        done
      done
      master=$(printf '%s\n' "$votes" | sed '/^$/d' | sort | uniq -c | awk '$1>=2 {print $2; exit}')
      [ -n "$master" ] && break
      echo 'Waiting for two Sentinels to agree before Redis rejoin' >&2
      sleep 2
    done
    umask 077
    sed '/^[[:space:]]*replicaof[[:space:]]/d; /^[[:space:]]*replica-announce-ip[[:space:]]/d' /data/redis.conf > /data/redis.conf.rejoin
    printf 'replica-announce-ip %s\n' "$self" >> /data/redis.conf.rejoin
    if [ "$master" != "$self" ]; then
      printf 'replicaof %s 6379\n' "$master" >> /data/redis.conf.rejoin
    fi
    mv /data/redis.conf.rejoin /data/redis.conf
    exec redis-server /data/redis.conf
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    case "$HOSTNAME" in
      nextcloud-redis-data-*)
        identity="$HOSTNAME"
        announce="$HOSTNAME.nextcloud-redis-data.nextcloud.svc.cluster.local"
        ;;
      *)
        identity=nextcloud-redis-quorum
        announce=nextcloud-redis-sentinel-2.nextcloud.svc.cluster.local
        ;;
    esac
    # Stable IDs and DNS addresses prevent obsolete voters accumulating after pod replacement.
    if [ ! -s /sentinel/sentinel.conf ]; then
      umask 077
      myid=$(printf '%s' "$identity" | sha1sum | cut -d ' ' -f 1)
      cat > /sentinel/sentinel.conf <<SENTINEL
    port 26379
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    sentinel myid $myid
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $announce
    sentinel monitor nextcloud nextcloud-redis-data-0.nextcloud-redis-data.nextcloud.svc.cluster.local 6379 2
    sentinel auth-pass nextcloud "$REDIS_PASSWORD"
    sentinel down-after-milliseconds nextcloud 5000
    sentinel failover-timeout nextcloud 60000
    sentinel parallel-syncs nextcloud 1
    SENTINEL
    fi
    exec redis-sentinel /sentinel/sentinel.conf
  haproxy.cfg: |
    global
      log stdout format raw local0
      nbthread 1
      maxconn 1024

    defaults
      log global
      mode tcp
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    resolvers kube-dns
      parse-resolv-conf
      hold valid 10s
      hold nx 1s

    frontend redis
      bind :6379
      default_backend redis-primary

    frontend redis-health
      bind :8404
      mode http
      monitor-uri /healthz
      monitor fail if { nbsrv(redis-primary) lt 1 }

    backend redis-primary
      option tcp-check
      tcp-check send AUTH\ __REDIS_PASSWORD__\r\n
      tcp-check expect string +OK
      tcp-check send ROLE\r\n
      tcp-check expect string master
      server redis-0 nextcloud-redis-data-0.nextcloud-redis-data.nextcloud.svc.cluster.local:6379 check inter 2s resolvers kube-dns init-addr last,libc,none
      server redis-1 nextcloud-redis-data-1.nextcloud-redis-data.nextcloud.svc.cluster.local:6379 check inter 2s resolvers kube-dns init-addr last,libc,none
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis-data
  namespace: nextcloud
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nextcloud-redis-data
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-redis-data
  namespace: nextcloud
spec:
  serviceName: nextcloud-redis-data
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis-data
  template:
    metadata:
      annotations:
        antalos.dev/redis-rejoin: sentinel-quorum-v1
      labels:
        app.kubernetes.io/name: nextcloud-redis-data
        nextcloud.antblu.net/sentinel: "true"
      annotations:
        config.antblu.net/revision: "${NEXTCLOUD_REDIS_HAPROXY_CONFIG_REVISION}"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nextcloud-redis-data
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-redis.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -p 26379 -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /sentinel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: nextcloud-redis-config
            defaultMode: 0555
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${NEXTCLOUD_REDIS_STORAGE_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis-sentinel-2
  namespace: nextcloud
spec:
  selector:
    app.kubernetes.io/name: nextcloud-redis-quorum
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis-quorum
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-redis-quorum
        nextcloud.antblu.net/sentinel: "true"
      annotations:
        config.antblu.net/revision: "${NEXTCLOUD_REDIS_HAPROXY_CONFIG_REVISION}"
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - key: quorum
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-redis
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -p 26379 -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: ${NEXTCLOUD_REDIS_QUORUM_CPU_REQUEST}
              memory: ${NEXTCLOUD_REDIS_QUORUM_MEMORY_REQUEST}
            limits:
              cpu: ${NEXTCLOUD_REDIS_QUORUM_CPU_LIMIT}
              memory: ${NEXTCLOUD_REDIS_QUORUM_MEMORY_LIMIT}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /sentinel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Mi
        - name: config
          configMap:
            name: nextcloud-redis-config
            defaultMode: 0555
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis-haproxy
  namespace: nextcloud
spec:
  selector:
    app.kubernetes.io/name: nextcloud-redis-haproxy
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis-haproxy
  namespace: nextcloud
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-redis-haproxy
      annotations:
        config.antblu.net/revision: "${NEXTCLOUD_REDIS_HAPROXY_CONFIG_REVISION}"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nextcloud-redis-haproxy
              topologyKey: kubernetes.io/hostname
      containers:
        - name: haproxy
          image: haproxy:${HAPROXY_IMAGE_TAG}
          command:
            - /bin/sh
            - -ec
            - escaped_password=$(printf '%s' "$REDIS_PASSWORD" | sed 's/[\/&]/\\&/g'); sed "s/__REDIS_PASSWORD__/$escaped_password/g" /config/haproxy.cfg > /tmp/haproxy.cfg; exec haproxy -W -db -f /tmp/haproxy.cfg
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8404
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: ${NEXTCLOUD_REDIS_QUORUM_CPU_REQUEST}
              memory: ${NEXTCLOUD_REDIS_HAPROXY_MEMORY_REQUEST}
            limits:
              cpu: ${NEXTCLOUD_REDIS_QUORUM_CPU_LIMIT}
              memory: ${NEXTCLOUD_REDIS_QUORUM_MEMORY_LIMIT}
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: nextcloud-redis-config
            defaultMode: 0555
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
