apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: ${NEXTCLOUD_CHART_VERSION}
      helm:
        values: |
          image:
            tag: ${NEXTCLOUD_IMAGE_TAG}
            flavor: apache

          lifecycle:
            postStartCommand:
              - sh
              - -ec
              - |-
                cd /var/www/html
                until php occ status >/dev/null 2>&1; do sleep 2; done
                php occ app:enable --no-interaction \
                  announcementcenter calendar notify_push contacts side_menu \
                  deck external forms mail integration_openai assistant eurooffice \
                  notes user_oidc spreed groupfolders whiteboard
                php occ config:app:set notify_push base_endpoint \
                  --value="https://${NEXTCLOUD_HOST}/push"
                php occ config:app:set eurooffice DocumentServerUrl \
                  --value="https://${EUROOFFICE_HOST}/"
                php occ config:app:set eurooffice DocumentServerInternalUrl \
                  --value="http://eurooffice.nextcloud.svc.cluster.local/"
                php occ config:app:set eurooffice StorageUrl \
                  --value="https://${NEXTCLOUD_HOST}/"
                php occ config:app:set eurooffice jwt_secret \
                  --value="$EUROOFFICE_JWT_SECRET"
                php occ config:app:set eurooffice jwt_header \
                  --value="AuthorizationJWT"
                php occ config:app:set whiteboard collabBackendUrl \
                  --value="https://${WHITEBOARD_HOST}"
                php occ config:app:set whiteboard jwt_secret_key \
                  --value="$WHITEBOARD_JWT_SECRET"

          replicaCount: 2
          podAnnotations:
            config.antblu.net/revision: "${NEXTCLOUD_CONFIG_REVISION}"

          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
                      app.kubernetes.io/instance: nextcloud
                      app.kubernetes.io/component: app
                  topologyKey: kubernetes.io/hostname

          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            tls:
              - secretName: nextcloud-tls
                hosts:
                  - ${NEXTCLOUD_HOST}

          nextcloud:
            host: ${NEXTCLOUD_HOST}
            podSecurityContext:
              fsGroup: 33
              fsGroupChangePolicy: OnRootMismatch
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            trustedDomains:
              - ${NEXTCLOUD_HOST}
            existingSecret:
              enabled: true
              secretName: nextcloud-admin
              usernameKey: nextcloud-username
              passwordKey: nextcloud-password
            openmetrics:
              allowedClients:
                - 127.0.0.1
                - ${KUBERNETES_POD_CIDR}
            phpConfigs:
              uploads.ini: |-
                upload_max_filesize=16G
                post_max_size=16G
                memory_limit=1G
                max_execution_time=3600
                max_input_time=3600
            extraVolumes:
              - name: nextcloud-shared-config
                configMap:
                  name: nextcloud-shared-config
              - name: nextcloud-apps
                persistentVolumeClaim:
                  claimName: nextcloud-apps
            extraVolumeMounts:
              - name: nextcloud-apps
                mountPath: /var/www/html/gitops_apps
                readOnly: true
            extraInitContainers:
              - name: prepare-nextcloud-config
                image: nextcloud:${NEXTCLOUD_IMAGE_TAG}
                command:
                  - sh
                  - -ec
                  - |-
                    set -eu
                    install -d -o 33 -g 33 /target /data /html
                    cp -a /usr/src/nextcloud/. /html/
                    chown -R 33:33 /html
                    for config_file in /usr/src/nextcloud/config/*.config.php /usr/src/nextcloud/config/.htaccess; do
                      install -o 33 -g 33 -m 0644 "$config_file" /target/
                    done
                    install -o 33 -g 33 -m 0644 /source/apps.config.php /target/apps.config.php
                    install -o 33 -g 33 -m 0440 /source/config.php /target/config.php
                    printf '%s\n' '# Nextcloud data directory' > /data/.ncdata
                    chown 33:33 /data/.ncdata
                    chmod 0440 /data/.ncdata
                volumeMounts:
                  - name: nextcloud-main
                    mountPath: /html
                    subPath: html
                  - name: nextcloud-main
                    mountPath: /target
                    subPath: config
                  - name: nextcloud-main
                    mountPath: /data
                    subPath: data
                  - name: nextcloud-shared-config
                    mountPath: /source
                    readOnly: true
              - name: install-nextcloud-apps
                image: nextcloud:${NEXTCLOUD_IMAGE_TAG}
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 33
                  runAsGroup: 33
                command:
                  - sh
                  - -ec
                  - sh /source/install-apps.sh /apps
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                volumeMounts:
                  - name: nextcloud-apps
                    mountPath: /apps
                  - name: nextcloud-shared-config
                    mountPath: /source
                    readOnly: true
            extraSidecarContainers:
              - name: notify-push
                image: nextcloud:${NEXTCLOUD_IMAGE_TAG}
                command:
                  - sh
                  - -ec
                  - |-
                    case "$(uname -m)" in
                      x86_64) notify_arch=x86_64 ;;
                      aarch64|arm64) notify_arch=aarch64 ;;
                      *) echo "Unsupported notify_push architecture: $(uname -m)" >&2; exit 1 ;;
                    esac
                    database_password=$(php -r 'echo rawurlencode(getenv("NOTIFY_PUSH_DATABASE_PASSWORD"));')
                    redis_password=$(php -r 'echo rawurlencode(getenv("NOTIFY_PUSH_REDIS_PASSWORD"));')
                    export DATABASE_URL="postgres://nextcloud:${database_password}@${NEXTCLOUD_DATABASE_CLUSTER}-rw.nextcloud.svc.cluster.local/nextcloud"
                    export REDIS_URL="redis://:${redis_password}@nextcloud-redis-haproxy.nextcloud.svc.cluster.local:6379"
                    exec "/var/www/html/gitops_apps/notify_push/bin/${notify_arch}/notify_push"
                ports:
                  - name: notify-push
                    containerPort: ${NOTIFY_PUSH_PORT}
                    protocol: TCP
                  - name: notify-metrics
                    containerPort: ${NOTIFY_PUSH_METRICS_PORT}
                    protocol: TCP
                env:
                  - name: PORT
                    value: "${NOTIFY_PUSH_PORT}"
                  - name: METRICS_PORT
                    value: "${NOTIFY_PUSH_METRICS_PORT}"
                  - name: NEXTCLOUD_URL
                    value: https://${NEXTCLOUD_HOST}
                  - name: DATABASE_PREFIX
                    value: oc_
                  - name: NOTIFY_PUSH_DATABASE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-db-app
                        key: password
                  - name: NOTIFY_PUSH_REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-redis
                        key: password
                readinessProbe:
                  tcpSocket:
                    port: notify-push
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
                livenessProbe:
                  tcpSocket:
                    port: notify-push
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: nextcloud-apps
                    mountPath: /var/www/html/gitops_apps
                    readOnly: true
            hooks:
              post-installation: |-
                #!/bin/sh
                set -eu
                su -s /bin/sh www-data -c 'php /var/www/html/occ background:cron'
            extraEnv:
              - name: PGSSLMODE
                value: disable
              - name: APACHE_DISABLE_REWRITE_IP
                value: "1"
              - name: TRUSTED_PROXIES
                value: ${KUBERNETES_POD_CIDR}
              - name: OVERWRITEPROTOCOL
                value: https
              - name: OVERWRITECLIURL
                value: https://${NEXTCLOUD_HOST}
              - name: NEXTCLOUD_INIT_HTACCESS
                value: "true"
              - name: NEXTCLOUD_INSTANCE_ID
                value: ${NEXTCLOUD_INSTANCE_ID}
              - name: NEXTCLOUD_SERVER_VERSION
                value: "${NEXTCLOUD_SERVER_VERSION}"
              - name: NEXTCLOUD_PASSWORD_SALT
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-config
                    key: password-salt
              - name: NEXTCLOUD_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-config
                    key: secret
              - name: EUROOFFICE_JWT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-companion-secrets
                    key: eurooffice-jwt-secret
              - name: WHITEBOARD_JWT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-companion-secrets
                    key: whiteboard-jwt-secret
              - name: OBJECTSTORE_S3_BUCKET
                value: ${NEXTCLOUD_S3_BUCKET}
              - name: OBJECTSTORE_S3_REGION
                value: ${GARAGE_S3_CUSTOM_REGION}
              - name: OBJECTSTORE_S3_HOST
                value: ${GARAGE_S3_IP}
              - name: OBJECTSTORE_S3_PORT
                value: "${GARAGE_S3_PORT}"
              - name: OBJECTSTORE_S3_KEY
                value: ${NEXTCLOUD_S3_ACCESS_KEY}
              - name: OBJECTSTORE_S3_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-s3
                    key: secret-key
              - name: OBJECTSTORE_S3_SSL
                value: "false"
              - name: OBJECTSTORE_S3_USEPATH_STYLE
                value: "true"
              - name: OBJECTSTORE_S3_AUTOCREATE
                value: "false"
              - name: OBJECTSTORE_S3_STORAGE_CLASS
                value: STANDARD

          internalDatabase:
            enabled: false

          externalDatabase:
            enabled: true
            type: postgresql
            host: ${NEXTCLOUD_DATABASE_CLUSTER}-rw.nextcloud.svc.cluster.local
            database: nextcloud
            existingSecret:
              enabled: true
              secretName: nextcloud-db-app
              usernameKey: username
              passwordKey: password

          externalRedis:
            enabled: true
            host: nextcloud-redis-haproxy.nextcloud.svc.cluster.local
            port: "6379"
            existingSecret:
              enabled: true
              secretName: nextcloud-redis
              passwordKey: password

          cronjob:
            enabled: true
            type: sidecar
            sidecar:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          persistence:
            enabled: false

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          startupProbe:
            enabled: true
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/nextcloud
      plugin:
        name: yaml-envsubst

  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
