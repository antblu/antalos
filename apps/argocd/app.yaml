apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: ${ARGOCD_CHART_VERSION}
      helm:
        releaseName: argocd
        valuesObject:
          redis-ha:
            haproxy:
              affinity: |
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values:
                              - ${TALOS_WORKER_LEFT}
                              - ${TALOS_WORKER_RIGHT}
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app: redis-ha-haproxy
                          release: argocd
        valueFiles:
          - $values/infrastructure/opentofu/argotofu/argocd-values.yaml
        parameters:
          - name: repoServer.initContainers[0].image
            value: mikefarah/yq:${ARGOCD_YQ_IMAGE_TAG}
          - name: repoServer.extraContainers[0].image
            value: quay.io/argoproj/argocd:${ARGOCD_CMP_IMAGE_TAG}
          - name: repoServer.podAnnotations.config\.antblu\.net/yaml-envsubst-revision
            value: "${ARGOCD_PLUGIN_CONFIG_REVISION}"
            forceString: true
          - name: server.ingress.hostname
            value: ${ARGOCD_HOST}
          - name: configs.cm.url
            value: https://${ARGOCD_HOST}
          - name: configs.cm.oidc\.config
            value: |
              name: Authentik
              issuer: https://${AUTHENTIK_HOST}/application/o/argo-cd/
              clientID: M1cYFNuKZE2pGDBMSUPHw8FCCjzIjL86jILMC1Sa
              # Reuse the existing sealed credential; $$ escapes Argo expansion.
              clientSecret: $$dex.authentik.clientSecret
              requestedScopes:
                - openid
                - profile
                - email
              requestedIDTokenClaims:
                groups:
                  essential: true

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      ref: values
      path: infrastructure/argocd

    - repoURL: https://github.com/antblu/antalos.git
      targetRevision: main
      path: apps/argocd
      plugin:
        name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Keep the reconciler alive until its replacement is healthy.
      - PruneLast=true
      - ServerSideApply=true
