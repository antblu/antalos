apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cal-diy-cnpg-role-binding
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    resourceNames:
      - cal-diy-db
    verbs:
      - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cal-diy-cnpg-role-binding
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cal-diy-cnpg-role-binding
subjects:
  - kind: ServiceAccount
    name: cnpg-operator-cloudnative-pg
    namespace: cnpg-system
