apiVersion: v1
kind: ConfigMap
metadata:
  name: cal-diy-redis-config
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  discover-master.sh: |
    #!/bin/sh
    set -eu
    for sentinel in ${CALDIY_REDIS_DATA_0_HOST} ${CALDIY_REDIS_DATA_1_HOST} ${CALDIY_REDIS_SENTINEL_2_HOST}; do
      reply=$(REDISCLI_AUTH="$REDIS_PASSWORD" timeout 3 redis-cli --raw -h "$sentinel" -p 26379 SENTINEL get-master-addr-by-name cal-diy 2>/dev/null) || continue
      set -- $reply
      if [ "$#" -eq 2 ] && [ "$2" = 6379 ]; then
        printf '%s %s\n' "$1" "$2"
        exit 0
      fi
    done
    exit 1
  start-redis.sh: |
    #!/bin/sh
    set -eu
    umask 077
    mkdir -p /data/redis
    config=/data/redis/redis.conf
    if [ ! -f "$config" ]; then
      cat > "$config" <<EOF
    port 6379
    dir /data/redis
    appendonly yes
    appendfsync everysec
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    masterauth "$REDIS_PASSWORD"
    replica-announce-ip $POD_DNS
    replica-announce-port 6379
    EOF
      if [ "$HOSTNAME" = cal-diy-redis-data-1 ]; then
        printf 'replicaof %s 6379\n' '${CALDIY_REDIS_DATA_0_HOST}' >> "$config"
      fi
    fi
    master=$(/config/discover-master.sh) || master=""
    if [ -n "$master" ]; then
      set -- $master
      sed -i '/^replicaof /d; /^slaveof /d' "$config"
      if [ "$1" != "$POD_DNS" ] && [ "$1" != "$POD_IP" ]; then
        printf 'replicaof %s %s\n' "$1" "$2" >> "$config"
      fi
    fi
    exec redis-server "$config"
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    umask 077
    mkdir -p /data/sentinel
    config=/data/sentinel/sentinel.conf
    if [ ! -f "$config" ]; then
      master=$(/config/discover-master.sh) || master="${CALDIY_REDIS_DATA_0_HOST} 6379"
      set -- $master
      cat > "$config" <<EOF
    port 26379
    protected-mode no
    requirepass "$REDIS_PASSWORD"
    sentinel sentinel-pass "$REDIS_PASSWORD"
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $POD_DNS
    sentinel announce-port 26379
    sentinel monitor cal-diy $1 $2 2
    sentinel auth-pass cal-diy "$REDIS_PASSWORD"
    sentinel down-after-milliseconds cal-diy 5000
    sentinel failover-timeout cal-diy 60000
    sentinel parallel-syncs cal-diy 1
    EOF
    fi
    exec redis-sentinel "$config"
  haproxy.cfg: |
    global
      log stdout format raw local0
      nbthread 1
      maxconn 1024

    defaults
      log global
      mode tcp
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    frontend redis
      bind :6379
      default_backend redis-primary

    backend redis-primary
      option tcp-check
      tcp-check send AUTH\ __REDIS_PASSWORD__\r\n
      tcp-check expect string +OK
      tcp-check send ROLE\r\n
      tcp-check expect string master
      server redis-0 ${CALDIY_REDIS_DATA_0_HOST}:6379 check inter 2s
      server redis-1 ${CALDIY_REDIS_DATA_1_HOST}:6379 check inter 2s
---
apiVersion: v1
kind: Service
metadata:
  name: cal-diy-redis-data
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cal-diy-redis-data
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cal-diy-redis-data
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: cal-diy-redis-data
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cal-diy-redis-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cal-diy-redis-data
        cal-diy.antblu.net/sentinel: "true"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cal-diy-redis-data
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - sh
            - -ec
            - case "$HOSTNAME" in cal-diy-redis-data-0) export POD_DNS="$DATA_0_HOST" ;; *) export POD_DNS="$DATA_1_HOST" ;; esac; exec /config/start-redis.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-diy-redis
                  key: password
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATA_0_HOST
              value: ${CALDIY_REDIS_DATA_0_HOST}
            - name: DATA_1_HOST
              value: ${CALDIY_REDIS_DATA_1_HOST}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - sh
            - -ec
            - case "$HOSTNAME" in cal-diy-redis-data-0) export POD_DNS="$DATA_0_HOST" ;; *) export POD_DNS="$DATA_1_HOST" ;; esac; exec /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-diy-redis
                  key: password
            - name: DATA_0_HOST
              value: ${CALDIY_REDIS_DATA_0_HOST}
            - name: DATA_1_HOST
              value: ${CALDIY_REDIS_DATA_1_HOST}
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -p 26379 ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: cal-diy-redis-config
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-local
        resources:
          requests:
            storage: ${CALDIY_REDIS_STORAGE_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: cal-diy-redis-sentinel-2
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: cal-diy-redis-quorum
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-diy-redis-quorum
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cal-diy-redis-quorum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cal-diy-redis-quorum
        cal-diy.antblu.net/sentinel: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ${TALOS_WORKER_RTX}
      tolerations:
        - key: quorum
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: redis:${REDIS_IMAGE_TAG}
          command:
            - /config/start-sentinel.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-diy-redis
                  key: password
            - name: POD_DNS
              value: ${CALDIY_REDIS_SENTINEL_2_HOST}
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -p 26379 ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: cal-diy-redis-config
            defaultMode: 0555
        - name: data
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cal-diy-redis
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: cal-diy-redis-haproxy
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-diy-redis-haproxy
  namespace: cal-diy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cal-diy-redis-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cal-diy-redis-haproxy
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cal-diy-redis-haproxy
              topologyKey: kubernetes.io/hostname
      containers:
        - name: haproxy
          image: haproxy:${HAPROXY_IMAGE_TAG}
          command:
            - /bin/sh
            - -ec
            - escaped_password=$(printf '%s' "$REDIS_PASSWORD" | sed 's/[\/&]/\\&/g'); sed "s/__REDIS_PASSWORD__/$escaped_password/g" /config/haproxy.cfg > /tmp/haproxy.cfg; exec haproxy -W -db -f /tmp/haproxy.cfg
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-diy-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: cal-diy-redis-config
