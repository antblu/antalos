          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cal-diy-config
          env:
            - name: DATABASE_USERNAME
              value: ${CALDIY_DATABASE_USERNAME}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-diy-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@${CALDIY_DATABASE_HOST}:5432/${CALDIY_DATABASE_NAME}?schema=public
            - name: DATABASE_DIRECT_URL
              value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@${CALDIY_DATABASE_HOST}:5432/${CALDIY_DATABASE_NAME}?schema=public
            - name: DATABASE_READ_URL
              value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@${CALDIY_DATABASE_HOST}:5432/${CALDIY_DATABASE_NAME}?schema=public
            - name: DATABASE_WRITE_URL
              value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@${CALDIY_DATABASE_HOST}:5432/${CALDIY_DATABASE_NAME}?schema=public
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-diy-redis
