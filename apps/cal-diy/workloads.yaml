            - name: REDIS_URL
              value: redis://default:$(REDIS_PASSWORD)@cal-diy-redis.cal-diy.svc.cluster.local:6379/0
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cal-diy-app
                  key: nextauth-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cal-diy-api
                  key: jwt-secret
            - name: CALCOM_SERVICE_ACCOUNT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cal-diy-api
                  key: calcom-service-account-encryption-key
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cal-diy-api
                  key: stripe-api-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cal-diy-api
                  key: stripe-webhook-secret
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 32Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: cal-diy-web
  namespace: cal-diy
spec:
  selector:
    app.kubernetes.io/name: cal-diy
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: cal-diy-api
  namespace: cal-diy
spec:
  selector:
    app.kubernetes.io/name: cal-diy
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cal-diy
  namespace: cal-diy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${CALDIY_HOST}
      secretName: cal-diy-tls
  rules:
    - host: ${CALDIY_HOST}
      http:
        paths:
          - path: /api/v2
            pathType: Prefix
            backend:
              service:
                name: cal-diy-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cal-diy-web
                port:
                  name: http
