apiVersion: v1
kind: ConfigMap
metadata:
  name: medusa-env
  namespace: medusa
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
data:
  NODE_ENV: production
  PORT: '9000'
  MEDUSA_TELEMETRY_DISABLED: 'true'
  ADMIN_CORS: https://${MEDUSA_HOST}
  AUTH_CORS: https://${MEDUSA_HOST}
  STORE_CORS: ''
  OIDC_DISPLAY_NAME: ${MEDUSA_OIDC_DISPLAY_NAME}
  OIDC_ISSUER: ${MEDUSA_OIDC_ISSUER}
  OIDC_CLIENT_ID: ${MEDUSA_OIDC_CLIENT_ID}
  OIDC_REQUIRE_VERIFIED_EMAIL: '${MEDUSA_OIDC_REQUIRE_VERIFIED_EMAIL}'
  OIDC_CALLBACK_URL: https://${MEDUSA_HOST}/app/login?auth_provider=antid
  GOOGLE_CALLBACK_URL: ${MEDUSA_CUSTOMER_GOOGLE_CALLBACK_URL}
  ODOO_SYNC_ENABLED: '${MEDUSA_ODOO_SYNC_ENABLED}'
  ODOO_URL: https://${ODOO_HOST}
  ODOO_DB_NAME: ${ODOO_DATABASE_NAME}
  REDIS_URL: redis://medusa-redis-data.medusa.svc.cluster.local:6379
  REDIS_SENTINELS: ${MEDUSA_REDIS_DATA_0_HOST},${MEDUSA_REDIS_DATA_1_HOST},${MEDUSA_REDIS_SENTINEL_2_HOST}
  S3_BUCKET: ${MEDUSA_S3_BUCKET}
  S3_ENDPOINT: ${MEDUSA_S3_ENDPOINT}
  S3_REGION: ${MEDUSA_S3_REGION}
  S3_FILE_URL: ${MEDUSA_S3_FILE_URL}
