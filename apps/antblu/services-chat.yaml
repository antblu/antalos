apiVersion: apps/v1
kind: Deployment
metadata:
  name: antblu-services-chat
  namespace: antblu
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: antblu-services-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: antblu-services-chat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: antblu-services-chat
      containers:
        - name: api
          image: python:${ANTBLU_CHAT_PYTHON_IMAGE_TAG}
          command:
            - python
            - -B
            - /app/server.py
          env:
            - name: PUBLIC_ORIGIN
              value: https://${ANTBLU_HOST}
            - name: OPEN_WEBUI_URL
              value: ${ANTBLU_CHAT_OPEN_WEBUI_URL}
            - name: LITELLM_URL
              value: ${ANTBLU_CHAT_LITELLM_URL}
            - name: LITELLM_MODEL
              value: ${ANTBLU_CHAT_MODEL}
            - name: OPEN_WEBUI_EMAIL
              valueFrom:
                secretKeyRef:
                  name: antblu-services-chat-open-webui
                  key: email
            - name: OPEN_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: antblu-services-chat-open-webui
                  key: password
            - name: OPEN_WEBUI_KNOWLEDGE_ID
              valueFrom:
                secretKeyRef:
                  name: antblu-services-chat-open-webui
                  key: knowledge-id
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: antblu-services-chat-litellm
                  key: api-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: implementation
              mountPath: /app
              readOnly: true
      volumes:
        - name: implementation
          configMap:
            name: antblu-services-chat
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: antblu-services-chat
  namespace: antblu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: antblu-services-chat
---
apiVersion: v1
kind: Service
metadata:
  name: antblu-services-chat
  namespace: antblu
spec:
  selector:
    app.kubernetes.io/name: antblu-services-chat
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: antblu-services-chat
  namespace: antblu
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,publichttps
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${ANTBLU_HOST}
      secretName: antblu-tls
  rules:
    - host: ${ANTBLU_HOST}
      http:
        paths:
          - path: /api/services-chat
            pathType: Exact
            backend:
              service:
                name: antblu-services-chat
                port:
                  name: http
