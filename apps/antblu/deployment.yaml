apiVersion: apps/v1
kind: Deployment
metadata:
  name: antblu
  namespace: antblu
  labels:
    app.kubernetes.io/name: antblu
    app.kubernetes.io/part-of: antblu
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: antblu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: antblu
        app.kubernetes.io/part-of: antblu
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: antblu
      containers:
        - name: nginx
          image: ${ANTBLU_IMAGE_REPOSITORY}:${ANTBLU_IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: antblu
  namespace: antblu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: antblu
---
apiVersion: v1
kind: Service
metadata:
  name: antblu
  namespace: antblu
  labels:
    app.kubernetes.io/name: antblu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: antblu
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
