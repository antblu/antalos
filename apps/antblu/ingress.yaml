apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: antblu
  namespace: antblu
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${ANTBLU_HOST}
      secretName: antblu-tls
  rules:
    - host: ${ANTBLU_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: antblu
                port:
                  name: http
