apiVersion: v1
kind: ConfigMap
metadata:
  name: mautic-redis-proxy
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 1024
    defaults
      log global
      mode tcp
      timeout connect 3s
      timeout client 60s
      timeout server 60s
    resolvers kube
      parse-resolv-conf
      hold valid 10s
    frontend redis
      bind :6379
      default_backend redis-primary
    frontend health
      bind :8404
      mode http
      monitor-uri /healthz
      monitor fail if { nbsrv(redis-primary) lt 1 }
    backend redis-primary
      option tcp-check
      tcp-check send AUTH\ __REDIS_PASSWORD__\r\n
      tcp-check expect string +OK
      tcp-check send ROLE\r\n
      tcp-check expect string master
      default-server check inter 2s fall 2 rise 1 resolvers kube init-addr last,libc,none on-marked-down shutdown-sessions
      server redis-0 ${MAUTIC_REDIS_DATA_0_HOST}:6379
      server redis-1 ${MAUTIC_REDIS_DATA_1_HOST}:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic-redis-proxy
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic-redis-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic-redis-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1010
        runAsGroup: 1010
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${TALOS_WORKER_LEFT}
                - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: mautic-redis-proxy
            topologyKey: kubernetes.io/hostname
      containers:
      - name: haproxy
        image: haproxy:${HAPROXY_IMAGE_TAG}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -ec
        - sed "s/__REDIS_PASSWORD__/$REDIS_PASSWORD/g" /config/haproxy.cfg > /tmp/haproxy.cfg; exec haproxy -W -db
          -f /tmp/haproxy.cfg
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mautic-redis
              key: password
        ports:
        - name: redis
          containerPort: 6379
        - name: health
          containerPort: 8404
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: health
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: mautic-redis-proxy
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mautic-redis
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  selector:
    app.kubernetes.io/name: mautic-redis-proxy
  ports:
  - name: redis
    port: 6379
    targetPort: redis
