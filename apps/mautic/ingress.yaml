apiVersion: v1
kind: Service
metadata:
  name: mautic
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  selector:
    app.kubernetes.io/name: mautic-web
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mautic
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ${MAUTIC_HOST}
    secretName: mautic-tls
  rules:
  - host: ${MAUTIC_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mautic
            port:
              name: http
