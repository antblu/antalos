apiVersion: batch/v1
kind: Job
metadata:
  name: mautic-install
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1010
        runAsGroup: 1010
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${TALOS_WORKER_LEFT}
                - ${TALOS_WORKER_RIGHT}
      containers:
      - name: mautic
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        args:
        - install
        envFrom:
        - configMapRef:
            name: mautic-env
        - secretRef:
            name: mautic-app
        - secretRef:
            name: mautic-admin
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/www/html/config
          subPath: config
        - name: data
          mountPath: /var/www/html/docroot/media/files
          subPath: files
        - name: data
          mountPath: /var/www/html/docroot/media/images
          subPath: images
        - name: var
          mountPath: /var/www/html/var
        - name: data
          mountPath: /var/www/html/var/logs
          subPath: logs
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mautic-data
      - name: var
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      initContainers:
      - name: prepare-local-volumes
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        command:
        - sh
        - -ec
        - chown 1010:1010 /runtime /scratch
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
        volumeMounts:
        - name: var
          mountPath: /runtime
        - name: tmp
          mountPath: /scratch
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - name: prepare-storage
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        args:
        - prepare-storage
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /mnt/mautic
        - name: var
          mountPath: /mnt/runtime
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
      restartPolicy: Never
