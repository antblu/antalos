apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic-web
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1010
        runAsGroup: 1010
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${TALOS_WORKER_LEFT}
                - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: mautic-web
            topologyKey: kubernetes.io/hostname
      containers:
      - name: mautic
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        args:
        - web
        envFrom:
        - configMapRef:
            name: mautic-env
        - secretRef:
            name: mautic-app
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/www/html/config
          subPath: config
        - name: data
          mountPath: /var/www/html/docroot/media/files
          subPath: files
        - name: data
          mountPath: /var/www/html/docroot/media/images
          subPath: images
        - name: var
          mountPath: /var/www/html/var
        - name: data
          mountPath: /var/www/html/var/logs
          subPath: logs
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          exec:
            command:
            - php
            - -r
            - |
              $ip = gethostbyname(gethostname());
              $context = stream_context_create(['http' => [
                  'header' => "Host: ${MAUTIC_HOST}\r\nX-Forwarded-Proto: https\r\nX-Forwarded-Port: 443\r\n",
                  'timeout' => 10,
                  'follow_location' => 0,
                  'ignore_errors' => true,
              ]]);
              @file_get_contents('http://'.$ip.':8080/s/login', false, $context);
              exit(preg_match('/^HTTP\/\S+ 200\b/', $http_response_header[0] ?? '') ? 0 : 1);
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - php
            - -r
            - |
              $ip = gethostbyname(gethostname());
              $context = stream_context_create(['http' => [
                  'header' => "Host: ${MAUTIC_HOST}\r\nX-Forwarded-Proto: https\r\nX-Forwarded-Port: 443\r\n",
                  'timeout' => 10,
                  'follow_location' => 0,
                  'ignore_errors' => true,
              ]]);
              @file_get_contents('http://'.$ip.':8080/s/login', false, $context);
              exit(preg_match('/^HTTP\/\S+ 200\b/', $http_response_header[0] ?? '') ? 0 : 1);
          periodSeconds: 10
          timeoutSeconds: 15
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mautic-data
      - name: var
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      initContainers:
      - name: prepare-local-volumes
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        command:
        - sh
        - -ec
        - chown 1010:1010 /runtime /scratch
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
        volumeMounts:
        - name: var
          mountPath: /runtime
        - name: tmp
          mountPath: /scratch
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - name: prepare-storage
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        args:
        - prepare-storage
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /mnt/mautic
        - name: var
          mountPath: /mnt/runtime
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
      - name: warm-production-cache
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        command:
        - sh
        - -ec
        - |
          until php bin/console cache:clear --env=prod --no-interaction; do
            echo 'Production cache initialization failed; waiting before retrying.'
            sleep 10
          done
        envFrom:
        - configMapRef:
            name: mautic-env
        - secretRef:
            name: mautic-app
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/www/html/config
          subPath: config
        - name: data
          mountPath: /var/www/html/docroot/media/files
          subPath: files
        - name: data
          mountPath: /var/www/html/docroot/media/images
          subPath: images
        - name: var
          mountPath: /var/www/html/var
        - name: data
          mountPath: /var/www/html/var/logs
          subPath: logs
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mautic-web
  namespace: mautic
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic-worker
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1010
        runAsGroup: 1010
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ${TALOS_WORKER_LEFT}
                - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: mautic-worker
            topologyKey: kubernetes.io/hostname
      containers:
      - name: mautic
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        args:
        - /usr/local/bin/antalos-mautic
        - worker
        envFrom:
        - configMapRef:
            name: mautic-env
        - secretRef:
            name: mautic-app
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/www/html/config
          subPath: config
        - name: data
          mountPath: /var/www/html/docroot/media/files
          subPath: files
        - name: data
          mountPath: /var/www/html/docroot/media/images
          subPath: images
        - name: var
          mountPath: /var/www/html/var
        - name: data
          mountPath: /var/www/html/var/logs
          subPath: logs
        - name: tmp
          mountPath: /tmp
        - name: consumer-recovery
          mountPath: /recovery
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          periodSeconds: 20
        command:
        - /bin/sh
        - /recovery/supervise.sh
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - test -r /tmp/consumer.pid && kill -0 "$(cat /tmp/consumer.pid)"
          periodSeconds: 5
          timeoutSeconds: 2
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mautic-data
      - name: var
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: consumer-recovery
        configMap:
          name: mautic-consumer-recovery
      initContainers:
      - name: prepare-local-volumes
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        command:
        - sh
        - -ec
        - chown 1010:1010 /runtime /scratch
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
        volumeMounts:
        - name: var
          mountPath: /runtime
        - name: tmp
          mountPath: /scratch
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - name: prepare-storage
        image: ${MAUTIC_IMAGE_REPOSITORY}:${MAUTIC_IMAGE_TAG}
        args:
        - prepare-storage
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /mnt/mautic
        - name: var
          mountPath: /mnt/runtime
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mautic-worker
  namespace: mautic
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic-worker
