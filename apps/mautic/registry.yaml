kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: mautic-registry
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '-7'
spec:
  template:
    metadata:
      name: mautic-registry
      namespace: mautic
    type: kubernetes.io/dockerconfigjson
  encryptedData:
    .dockerconfigjson: 
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mautic
  annotations:
    argocd.argoproj.io/sync-wave: '-7'
automountServiceAccountToken: false
imagePullSecrets:
- name: mautic-registry
