apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.traefik.io/traefik'
    chart: traefik
    targetRevision: ${TRAEFIK_CHART_VERSION} # Use the latest stable chart version
    helm:
      valuesObject:
        deployment:
          replicas: 2
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        service:
          type: LoadBalancer
          annotations:
            # Pinned IP address
            metallb.io/loadBalancerIPs: ${INGRESS_LOAD_BALANCER_IP}
            metallb.io/allow-shared-ip: antblu-net
        ports:
          web:
            expose:
              default: false
          ldaps:
            port: 636
            expose:
              default: true
            exposedPort: 636
            protocol: TCP
          rustdesk-nat:
            port: 21115
            expose:
              default: true
            exposedPort: 21115
            protocol: TCP
          rustdesk-id-tcp:
            port: 21116
            expose:
              default: true
            exposedPort: 21116
            protocol: TCP
          rustdesk-id-udp:
            port: 21116
            expose:
              default: false
            exposedPort: 21116
            protocol: UDP
          rustdesk-relay:
            port: 21117
            expose:
              default: true
            exposedPort: 21117
            protocol: TCP
          rustdesk-rly-b:
            port: 21120
            expose:
              default: true
            exposedPort: 21120
            protocol: TCP
          rustdesk-ws-id:
            port: 21118
            expose:
              default: true
            exposedPort: 21118
            protocol: TCP
          rustdesk-ws-rly:
            port: 21119
            expose:
              default: true
            exposedPort: 21119
            protocol: TCP
        ingressClass:
          enabled: true
          isDefaultClass: true
        metrics:
          prometheus:
            addEntryPointsLabels: true
            addRoutersLabels: true
            addServicesLabels: true
            service:
              enabled: true
              labels:
                metrics.antblu.net/scrape: traefik
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`${TRAEFIK_HOST}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
            entryPoints:
              - websecure
            middlewares:
              - name: authentik-forward-auth
            tls:
              secretName: traefik-dashboard-tls
        providers:
          kubernetesCRD:
            allowExternalNameServices: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps/traefik
    plugin:
      name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
