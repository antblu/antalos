apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vaultwarden-admin-authentik
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
    - X-authentik-username
    - X-authentik-groups
    - X-authentik-email
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-administration
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`${VAULTWARDEN_HOST}`) && PathPrefix(`/admin`)
    priority: 100
    middlewares:
    - name: vaultwarden-admin-authentik
    services:
    - name: vaultwarden
      port: 80
  tls:
    secretName: vaultwarden-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden-ingress
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-authentik-callback
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.priority: '110'
spec:
  ingressClassName: traefik
  rules:
  - host: ${VAULTWARDEN_HOST}
    http:
      paths:
      - path: /outpost.goauthentik.io/
        pathType: Prefix
        backend:
          service:
            name: authentik-server
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-authorization-gateway
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {}
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8080;
        client_max_body_size 525m;
        proxy_http_version 1.1;
        proxy_set_header Host ${VAULTWARDEN_HOST};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        location / {
          proxy_pass http://127.0.0.1:8082;
        }
        location ~* ^/admin {
          auth_request /_authorization;
          proxy_pass http://127.0.0.1:8082;
        }
        location = /_authorization {
          internal;
          proxy_pass http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Host ${VAULTWARDEN_HOST};
          proxy_set_header X-Original-URL https://${VAULTWARDEN_HOST}$request_uri;
          proxy_set_header X-Forwarded-Method $request_method;
          proxy_set_header X-Forwarded-Proto https;
        }
      }
    }
