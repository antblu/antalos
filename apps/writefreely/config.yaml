apiVersion: v1
kind: ConfigMap
metadata:
  name: writefreely-config
  namespace: writefreely
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
data:
  config.ini: |
    [server]
    bind = 0.0.0.0
    port = 8080
    autocert = false

    [app]
    host = https://${WRITEFREELY_HOST}
    site_name = ${WRITEFREELY_SITE_NAME}
    site_description = ${WRITEFREELY_SITE_DESCRIPTION}
    theme = write
    single_user = false
    min_username_len = 3
    max_blogs = 0
    open_registration = false
    open_deletion = false
    federation = false
    default_visibility = public

    [database]
    type = mysql
    host = writefreely-db-primary
    port = 3306
    database = writefreely
    username = writefreely
  oidc.ini: |
    [oauth.generic]
    display_name = antID
    client_id = ${WRITEFREELY_OIDC_CLIENT_ID}
    host = https://${AUTHENTIK_HOST}
    auth_endpoint = /application/o/authorize/
    token_endpoint = /application/o/token/
    inspect_endpoint = /application/o/userinfo/
    scope = openid
    map_user_id = sub
  configure.sh: |
    #!/bin/sh
    set -eu
    umask 077
    cat /settings/config.ini > /runtime/config.ini
    printf 'password = %s\n' "$(cat /credentials/db-password)" >> /runtime/config.ini
    if [ -f /oidc/client-secret ]; then
      printf '\n' >> /runtime/config.ini
      cat /settings/oidc.ini >> /runtime/config.ini
      printf 'client_secret = %s\n' "$(cat /oidc/client-secret)" >> /runtime/config.ini
    fi
