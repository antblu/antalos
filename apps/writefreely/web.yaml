apiVersion: apps/v1
kind: Deployment
metadata:
  name: writefreely
  namespace: writefreely
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: writefreely
  template:
    metadata:
      annotations:
        antalos.net/oidc-revision: "${WRITEFREELY_OIDC_REVISION}"
      labels:
        app.kubernetes.io/name: writefreely
        app.kubernetes.io/part-of: antalos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2
        runAsGroup: 2
        fsGroup: 2
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: writefreely
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: configure
          image: ghcr.io/writefreely/writefreely:${WRITEFREELY_IMAGE_TAG}
          command:
            - /bin/sh
            - /settings/configure.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: settings
              mountPath: /settings
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: oidc
              mountPath: /oidc
              readOnly: true
            - name: runtime
              mountPath: /runtime
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: writefreely
          image: ghcr.io/writefreely/writefreely:${WRITEFREELY_IMAGE_TAG}
          args:
            - -c
            - /runtime/config.ini
            - serve
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
              readOnly: true
            - name: keys
              mountPath: /go/keys
              readOnly: true
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
        - name: settings
          configMap:
            name: writefreely-config
        - name: credentials
          secret:
            secretName: writefreely-credentials
            defaultMode: 288
            items:
              - key: db-password
                path: db-password
        - name: keys
          secret:
            secretName: writefreely-credentials
            defaultMode: 288
            items:
              - key: email.aes256
                path: email.aes256
              - key: cookies_auth.aes256
                path: cookies_auth.aes256
              - key: cookies_enc.aes256
                path: cookies_enc.aes256
              - key: csrf.aes256
                path: csrf.aes256
        - name: oidc
          secret:
            secretName: writefreely-oidc
            defaultMode: 288
            items:
              - key: client-secret
                path: client-secret
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: writefreely
  namespace: writefreely
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: writefreely
---
apiVersion: v1
kind: Service
metadata:
  name: writefreely
  namespace: writefreely
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: writefreely
  ports:
    - name: http
      port: 80
      targetPort: http
