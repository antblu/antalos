apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: writefreely-tls
  namespace: writefreely
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  secretName: writefreely-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ${WRITEFREELY_HOST}
