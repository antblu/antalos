apiVersion: v1
kind: ServiceAccount
metadata:
  name: odoo-bootstrap
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odoo-bootstrap
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
rules:
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    resourceNames:
      - odoo
    verbs:
      - get
      - patch
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odoo-bootstrap
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
subjects:
  - kind: ServiceAccount
    name: odoo-bootstrap
    namespace: odoo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odoo-bootstrap
