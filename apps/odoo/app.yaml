apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps/odoo
    plugin:
      name: yaml-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo
  # Completed migration Jobs have immutable templates; preserve their history.
  ignoreDifferences:
    - group: batch
      kind: Job
      name: odoo-bootstrap-ha-v1
      namespace: odoo
      jsonPointers:
        - /spec/template
    - group: batch
      kind: Job
      name: odoo-auth-oidc-v1
      namespace: odoo
      jsonPointers:
        - /spec/template
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
