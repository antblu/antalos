apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
      annotations:
        antalos.net/storage-revision: ha-1
        antalos.net/jit-addon-revision: "${ODOO_JIT_ADDON_REVISION}"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: odoo
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: install-storage-addons
          image: docker.io/library/python:${ODOO_ADDON_INSTALLER_IMAGE_TAG}
          command:
            - python3
            - /config/install-addons.py
          env:
            - name: OCA_STORAGE_REVISION
              value: ${ODOO_OCA_STORAGE_REVISION}
            - name: S3FS_VERSION
              value: ${ODOO_S3FS_VERSION}
            - name: SLUGIFY_VERSION
              value: ${ODOO_SLUGIFY_VERSION}
            - name: OCA_SERVER_AUTH_REVISION
              value: ${ODOO_OCA_SERVER_AUTH_REVISION}
            - name: OCA_SERVER_TOOLS_REVISION
              value: ${ODOO_OCA_SERVER_TOOLS_REVISION}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: commerce-addons
              mountPath: /commerce-addons
              readOnly: true
            - name: custom-addons
              mountPath: /custom-addons
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: python-dependencies
              mountPath: /opt/python
            - name: addons
              mountPath: /mnt/extra-addons
        - name: bootstrap
          image: docker.io/library/odoo:${ODOO_IMAGE_TAG}
          command:
            - python3
            - /config/bootstrap.py
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime-config
              mountPath: /run/odoo
            - name: database-credentials
              mountPath: /credentials/database
              readOnly: true
            - name: app-credentials
              mountPath: /credentials/app
              readOnly: true
            - name: python-dependencies
              mountPath: /opt/python
              readOnly: true
            - name: addons
              mountPath: /mnt/extra-addons
              readOnly: true
          env:
            - name: PYTHONPATH
              value: /opt/python
            - name: AWS_DEFAULT_REGION
              value: ${ODOO_S3_REGION}
            - name: ODOO_S3_ENDPOINT
              value: ${ODOO_S3_ENDPOINT}
            - name: ODOO_S3_BUCKET
              value: ${ODOO_S3_BUCKET}
            - name: ODOO_S3_ATTACHMENT_PREFIX
              value: ${ODOO_S3_ATTACHMENT_PREFIX}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: secret-access-key
            - name: MEDUSA_FULFILLMENT_URL
              value: ${ODOO_MEDUSA_FULFILLMENT_URL}
            - name: FULFILLMENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: odoo-medusa-fulfillment
                  key: FULFILLMENT_WEBHOOK_SECRET
                  optional: true
            - name: SESSION_DB_URI
              value: ${ODOO_DATABASE_NAME}
      containers:
        - name: odoo
          image: docker.io/library/odoo:${ODOO_IMAGE_TAG}
          command:
            - odoo
          args:
            - --config=/run/odoo/odoo.conf
          ports:
            - name: http
              containerPort: 8069
          startupProbe:
            httpGet:
              path: /web/login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /web/login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
            - name: runtime-config
              mountPath: /run/odoo
              readOnly: true
            - name: python-dependencies
              mountPath: /opt/python
              readOnly: true
            - name: addons
              mountPath: /mnt/extra-addons
              readOnly: true
          env:
            - name: PYTHONPATH
              value: /opt/python
            - name: AWS_DEFAULT_REGION
              value: ${ODOO_S3_REGION}
            - name: ODOO_S3_ENDPOINT
              value: ${ODOO_S3_ENDPOINT}
            - name: ODOO_S3_BUCKET
              value: ${ODOO_S3_BUCKET}
            - name: ODOO_S3_ATTACHMENT_PREFIX
              value: ${ODOO_S3_ATTACHMENT_PREFIX}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: secret-access-key
            - name: MEDUSA_FULFILLMENT_URL
              value: ${ODOO_MEDUSA_FULFILLMENT_URL}
            - name: FULFILLMENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: odoo-medusa-fulfillment
                  key: FULFILLMENT_WEBHOOK_SECRET
                  optional: true
            - name: SESSION_DB_URI
              value: ${ODOO_DATABASE_NAME}
      volumes:
        - name: commerce-addons
          configMap:
            name: odoo-commerce-addon
            items:
              - key: __init__.py
                path: medusa_bridge/__init__.py
              - key: __manifest__.py
                path: medusa_bridge/__manifest__.py
              - key: data__cron.xml
                path: medusa_bridge/data/cron.xml
              - key: models____init__.py
                path: medusa_bridge/models/__init__.py
              - key: models__fulfillment.py
                path: medusa_bridge/models/fulfillment.py
              - key: models__sale_order.py
                path: medusa_bridge/models/sale_order.py
              - key: security__groups.xml
                path: medusa_bridge/security/groups.xml
              - key: security__ir.model.access.csv
                path: medusa_bridge/security/ir.model.access.csv
              - key: views__picking.xml
                path: medusa_bridge/views/picking.xml
        - name: custom-addons
          configMap:
            name: odoo-authentik-jit-addon
            items:
              - key: authentik_jit____init__.py
                path: authentik_jit/__init__.py
              - key: authentik_jit____manifest__.py
                path: authentik_jit/__manifest__.py
              - key: authentik_jit__models____init__.py
                path: authentik_jit/models/__init__.py
              - key: authentik_jit__models__auth_oauth_provider.py
                path: authentik_jit/models/auth_oauth_provider.py
              - key: authentik_jit__models__res_users.py
                path: authentik_jit/models/res_users.py
              - key: authentik_jit__views__auth_oauth_provider_views.xml
                path: authentik_jit/views/auth_oauth_provider_views.xml
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: odoo-config
        - name: runtime-config
          emptyDir:
            medium: Memory
        - name: database-credentials
          secret:
            secretName: odoo-db
            defaultMode: 288
        - name: app-credentials
          secret:
            secretName: odoo-app
            defaultMode: 288
        - name: python-dependencies
          emptyDir: {}
        - name: addons
          emptyDir: {}
  minReadySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: odoo
spec:
  selector:
    app.kubernetes.io/name: odoo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
  namespace: odoo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${ODOO_HOST}
      secretName: odoo-tls
  rules:
    - host: ${ODOO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  name: http
