apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
      annotations:
        antalos.net/storage-revision: ha-1
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ${TALOS_WORKER_LEFT}
                      - ${TALOS_WORKER_RIGHT}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: odoo
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: install-storage-addons
          image: docker.io/library/python:${ODOO_ADDON_INSTALLER_IMAGE_TAG}
          command:
            - python3
            - /config/install-addons.py
          env:
            - name: OCA_STORAGE_REVISION
              value: ${ODOO_OCA_STORAGE_REVISION}
            - name: S3FS_VERSION
              value: ${ODOO_S3FS_VERSION}
            - name: SLUGIFY_VERSION
              value: ${ODOO_SLUGIFY_VERSION}
            - name: OCA_SERVER_TOOLS_REVISION
              value: ${ODOO_OCA_SERVER_TOOLS_REVISION}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: python-dependencies
              mountPath: /opt/python
            - name: addons
              mountPath: /mnt/extra-addons
        - name: bootstrap
          image: docker.io/library/odoo:${ODOO_IMAGE_TAG}
          command:
            - python3
            - /config/bootstrap.py
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime-config
              mountPath: /run/odoo
            - name: database-credentials
              mountPath: /credentials/database
              readOnly: true
            - name: app-credentials
              mountPath: /credentials/app
              readOnly: true
            - name: python-dependencies
              mountPath: /opt/python
              readOnly: true
            - name: addons
              mountPath: /mnt/extra-addons
              readOnly: true
          env:
            - name: PYTHONPATH
              value: /opt/python
            - name: AWS_DEFAULT_REGION
              value: ${ODOO_S3_REGION}
            - name: ODOO_S3_ENDPOINT
              value: ${ODOO_S3_ENDPOINT}
            - name: ODOO_S3_BUCKET
              value: ${ODOO_S3_BUCKET}
            - name: ODOO_S3_ATTACHMENT_PREFIX
              value: ${ODOO_S3_ATTACHMENT_PREFIX}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: secret-access-key
            - name: SESSION_DB_URI
              value: ${ODOO_DATABASE_NAME}
            - name: SESSION_DB_URI
              value: ${ODOO_DATABASE_NAME}
      containers:
        - name: odoo
          image: docker.io/library/odoo:${ODOO_IMAGE_TAG}
          command:
            - odoo
          args:
            - --config=/run/odoo/odoo.conf
          ports:
            - name: http
              containerPort: 8069
          startupProbe:
            httpGet:
              path: /web/login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /web/login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
            - name: runtime-config
              mountPath: /run/odoo
              readOnly: true
            - name: python-dependencies
              mountPath: /opt/python
              readOnly: true
            - name: addons
              mountPath: /mnt/extra-addons
              readOnly: true
          env:
            - name: PYTHONPATH
              value: /opt/python
            - name: AWS_DEFAULT_REGION
              value: ${ODOO_S3_REGION}
            - name: ODOO_S3_ENDPOINT
              value: ${ODOO_S3_ENDPOINT}
            - name: ODOO_S3_BUCKET
              value: ${ODOO_S3_BUCKET}
            - name: ODOO_S3_ATTACHMENT_PREFIX
              value: ${ODOO_S3_ATTACHMENT_PREFIX}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: odoo-s3
                  key: secret-access-key
            - name: SESSION_DB_URI
              value: ${ODOO_DATABASE_NAME}
            - name: SESSION_DB_URI
              value: ${ODOO_DATABASE_NAME}
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: odoo-config
        - name: runtime-config
          emptyDir:
            medium: Memory
        - name: database-credentials
          secret:
            secretName: odoo-db
            defaultMode: 288
        - name: app-credentials
          secret:
            secretName: odoo-app
            defaultMode: 288
        - name: python-dependencies
          emptyDir: {}
        - name: addons
          emptyDir: {}
  minReadySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: odoo
spec:
  selector:
    app.kubernetes.io/name: odoo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
  namespace: odoo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${ODOO_HOST}
      secretName: odoo-tls
  rules:
    - host: ${ODOO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  name: http
