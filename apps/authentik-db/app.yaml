apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-db
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/antblu/antalos.git
    targetRevision: main
    path: apps/authentik-db
    plugin:
      name: yaml-envsubst

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true