name: Build Medusa backend image

on:
  pull_request:
    paths:
      - apps/medusa/image/**
      - apps/variables.yaml
      - .github/workflows/medusa-image.yaml
  push:
    branches:
      - main
    paths:
      - apps/medusa/image/**
      - apps/variables.yaml
      - .github/workflows/medusa-image.yaml
  workflow_dispatch:

concurrency:
  group: medusa-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Read shared build settings
        id: versions
        shell: bash
        run: |
          node_tag="$(sed -n 's/^  MEDUSA_NODE_IMAGE_TAG: //p' apps/variables.yaml)"
          version="$(sed -n 's/^  MEDUSA_VERSION: //p' apps/variables.yaml)"
          repository="$(sed -n 's/^  MEDUSA_IMAGE_REPOSITORY: //p' apps/variables.yaml)"
          tag="$(sed -n 's/^  MEDUSA_IMAGE_TAG: //p' apps/variables.yaml)"
          test -n "$node_tag" && test -n "$version" && test -n "$repository" && test -n "$tag"
          echo "node=$node_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$repository:$tag" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend and Admin
        uses: docker/build-push-action@v7
        with:
          context: apps/medusa/image
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.versions.outputs.image }}
          build-args: |
            NODE_IMAGE_TAG=${{ steps.versions.outputs.node }}
            MEDUSA_VERSION=${{ steps.versions.outputs.version }}
          cache-from: type=gha,scope=medusa
          cache-to: type=gha,mode=max,scope=medusa
