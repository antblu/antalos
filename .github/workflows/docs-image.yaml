name: Build documentation image

on:
  pull_request:
    paths:
      - docs/**
      - site/**
      - apps/variables.yaml
      - .github/workflows/docs-image.yaml
  push:
    branches:
      - main
    paths:
      - docs/**
      - site/**
      - apps/variables.yaml
      - .github/workflows/docs-image.yaml
  workflow_dispatch:

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/antalos-docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read build image versions
        id: versions
        shell: bash
        run: |
          node_tag="$(sed -n 's/^  DOCS_NODE_IMAGE_TAG: //p' apps/variables.yaml)"
          nginx_tag="$(sed -n 's/^  DOCS_NGINX_IMAGE_TAG: //p' apps/variables.yaml)"
          test -n "$node_tag"
          test -n "$nginx_tag"
          echo "node=$node_tag" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE_TAG=${{ steps.versions.outputs.node }}
            NGINX_IMAGE_TAG=${{ steps.versions.outputs.nginx }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
