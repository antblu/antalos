name: Renovate dependency coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Prefer self-hosted automatically, or choose a runner explicitly
        type: choice
        default: auto
        options:
          - auto
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yaml
    permissions:
      actions: write
    with:
      runner: ${{ inputs.runner || 'auto' }}
  coverage:
    needs: select-runner
    timeout-minutes: 15
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate configuration and dependency coverage
        shell: bash
        run: |
          renovate_tag="$(sed -n 's/^  RENOVATE_IMAGE_TAG: //p' apps/variables.yaml)"
          test -n "$renovate_tag"
          image="ghcr.io/renovatebot/renovate:$renovate_tag"
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
            --entrypoint renovate-config-validator "$image" renovate.json
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
            --entrypoint node "$image" tools/check-renovate-coverage.mjs
